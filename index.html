<script>
(function(){
'use strict';
/* ============================================================
   车辆档案库 · 单页应用外壳
   数据全部由浏览器原生 fetch：ace/<版本>/<file>.json
   ============================================================ */

/* ---------- 工具 ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* ---------- 图片 ----------
   数据里只有文件名（如 10000_b.png），统一挂到 ace/img/ 下。
   把图片放进 ace/img/ 即自动生效；没放就显示字母占位，不会开天窗。
   加载成功淡入盖住占位符，加载失败直接把 img 移除、露出占位符。 */
const IMG_BASE='ace/img/';
const IMG_EXT=/\.(png|jpe?g|webp|gif|avif|svg)$/i;
/* 从一条记录里按顺序挑第一个像图片文件的值 */
function pickImg(rec){
  if(!rec||typeof rec!=='object') return '';
  for(const k of ['图标b','图标m','图标s','图标','大图','小图','加载图资源','小地图资源','主图标']){
    const v=rec[k];
    if(typeof v==='string'&&IMG_EXT.test(v)) return v;
  }
  for(const k in rec){
    const v=rec[k];
    if(typeof v==='string'&&IMG_EXT.test(v)) return v;
    if(v&&typeof v==='object'&&!Array.isArray(v)){ const r=pickImg(v); if(r) return r; }
  }
  return '';
}
/* 按「命名空间」分别探测（车辆 / 地图 / 称号… 各探一次）：
   探测通过才渲染图片，没上传图片时每个视图只多发 1 个请求，
   不会出现几百张卡片一起 404 的情况。 */
const IMG_NS=Object.create(null);      /* ns -> undefined未探测 / true可用 / false没图 / null探测中 */
function cimg(file,name,ns){
  if(!file||IMG_NS[ns||'veh']!==true) return '';
  return '<img class="cimg" src="'+esc(IMG_BASE+file)+'" alt="'+esc(name||'')+'" loading="lazy" decoding="async">';
}
function probeNS(ns,file){
  if(!file||IMG_NS[ns]!==undefined) return;
  IMG_NS[ns]=null;
  const im=new Image();
  im.onload=function(){ IMG_NS[ns]=true; route(); };
  im.onerror=function(){ IMG_NS[ns]=false; };
  im.src=IMG_BASE+file;
}
/* 车辆：沿用旧入口名，探测 veh 命名空间 */
function probeImages(){
  const c=CAR_INDEX.find(function(x){ return x.thumb; });
  if(c) probeNS('veh',c.thumb);
}
/* load / error 不冒泡，只能在捕获阶段统一接管 */
document.addEventListener('load',function(e){
  const t=e.target;
  if(t&&t.tagName==='IMG'&&t.classList&&t.classList.contains('cimg')) t.style.opacity='1';
},true);
document.addEventListener('error',function(e){
  const t=e.target;
  if(t&&t.tagName==='IMG') t.remove();
},true);
const fmt=v=>(v===undefined||v===null||v==='')?'—':v;
const pad2=n=>String(n).padStart(2,'0');
/* 版本号 = Unix 时间戳的分钟数 */
function verTime(id){
  const n=Number(id);
  if(!isFinite(n)||n<=0) return '';
  const d=new Date(n*60000);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
}
/* 富文本：游戏文本用 #rrggbb 行内着色；近白 = 恢复默认色，亮色压暗 */
const rich=(function(){
  const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const lin=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)};
  const h2=v=>v.toString(16).padStart(2,'0');
  return function(s){
    if(s===undefined||s===null) return '';
    const parts=String(s).split(/(#[0-9a-fA-F]{6})/);
    let cur=null,out='';
    for(const p of parts){
      if(!p) continue;
      if(/^#[0-9a-fA-F]{6}$/.test(p)){ cur=p.toLowerCase(); continue; }
      if(!cur){ out+=esc(p); continue; }
      let [r,g,b]=rgb(cur);
      if(Math.min(r,g,b)>=232){ out+=esc(p); continue; }
      let L=0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b),i=0;
      while(L>0.72&&i<24){ r=Math.round(r*.88); g=Math.round(g*.88); b=Math.round(b*.88);
        L=0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b); i++; }
      out+='<span style="color:#'+h2(r)+h2(g)+h2(b)+'">'+esc(p)+'</span>';
    }
    return out;
  };
})();
const initial=s=>{s=String(s||'').trim();if(!s)return '?';return /[A-Za-z]/.test(s[0])?s[0].toUpperCase():s[0]};
const pct=v=>(v===undefined||v===null||v==='')?null:(Math.round(v/100*100)/100)+'%';
const RCOLOR={'普通':'#6b7280','稀有':'#2563eb','史诗':'#9333ea','传说':'#d97706','神话':'#dc2626','限定':'#0d9488'};
const rcolor=l=>RCOLOR[l]||'#9aa1ad';
function tierOf(g){
  g=Number(g)||0;
  const m={1:['普通','#9aa6bd'],2:['稀有','#3b82f6'],3:['史诗','#a855f7'],4:['传说','#f5a623']};
  return {name:m[g]?m[g][0]:'未知',color:m[g]?m[g][1]:'#9aa6bd'};
}
const timeKey=r=>{const s=String((r&&r['时间'])||'');const m=s.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);return m?Date.UTC(+m[1],+m[2]-1,+m[3]):0};
const srank=k=>{k=String(k||'');if(k.indexOf('常驻')>=0)return -1e9;const m=k.match(/(\d+)/);return m?-Number(m[1]):0};
const hueOf=k=>{k=String(k||'');if(k.indexOf('常驻')>=0)return 268;const m=k.match(/(\d+)/);return m?(Number(m[1])*47+18)%360:210};
function shapeSVG(name){
  const n=String(name||''), V='viewBox="0 0 24 24"';
  const pp=function(sides,r,off){ r=r||8.5; const p=[];
    for(let i=0;i<sides;i++){const a=-Math.PI/2+(off||0)+i*2*Math.PI/sides;p.push((12+r*Math.cos(a)).toFixed(1)+','+(12+r*Math.sin(a)).toFixed(1));}
    return p.join(' '); };
  if(n.indexOf('圆')>=0)  return '<svg '+V+'><circle cx="12" cy="12" r="8.5"/></svg>';
  if(n.indexOf('三角')>=0)return '<svg '+V+'><polygon points="'+pp(3,9)+'"/></svg>';
  if(n.indexOf('菱形')>=0)return '<svg '+V+'><polygon points="'+pp(4,9)+'"/></svg>';
  if(/V/i.test(n))        return '<svg '+V+'><path d="M5 5 L12 19 L19 5"/></svg>';
  const m=n.match(/(\d+)/); const sides=m?Math.max(3,+m[1]):(n.indexOf('六')>=0?6:5);
  const off=sides===6?Math.PI/6:0;
  return '<svg '+V+'><polygon points="'+pp(sides,9,off)+'"/></svg>';
}
/* 芯片形状 → 短名 */
const shapeShort=s=>String(s||'').replace('芯片','')||'—';

/* ---------- 数据缓存：ace/<版本>/<file> ---------- */
const DATA_CACHE=Object.create(null);
function dataUrl(ver,file){ return 'ace/'+ver+'/'+file; }
function fetchData(ver,file){
  const k=ver+'|'+file;
  if(DATA_CACHE[k]) return DATA_CACHE[k];
  const p=fetch(dataUrl(ver,file)).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status+' · '+file); return r.json(); });
  DATA_CACHE[k]=p;
  return p;
}
let CUR_VER='';
let VERSIONS=[];
const AUX_CACHE={};

/* ============================================================
   版本管理（侧栏顶部）
   ============================================================ */
const verSel=$('verSel');
function renderVer(){
  const vers=VERSIONS.slice().sort((a,b)=>Number(b.id)-Number(a.id));
  verSel.innerHTML='<button class="vsel-btn" type="button"><span class="ic">版</span>'+
    '<span class="vtxt"><b>'+esc(CUR_VER)+'</b><i>'+esc(verTime(CUR_VER))+'</i></span>'+
    '<span class="arrow">▼</span></button>'+
    '<div class="vsel-list">'+vers.map(function(x){
      const t=verTime(x.id);
      return '<div class="opt'+(x.id===CUR_VER?' on':'')+'" data-v="'+esc(x.id)+'" title="'+esc(t)+'">'+
        '<span>'+esc(x.label)+'</span>'+(t?'<span class="hint">'+esc(t.slice(0,10))+'</span>':'')+'</div>';
    }).join('')+'</div>';
}
verSel.addEventListener('click',function(e){
  const opt=e.target.closest('.opt');
  if(opt){ verSel.classList.remove('open'); setVer(opt.getAttribute('data-v')); return; }
  if(e.target.closest('.vsel-btn')) verSel.classList.toggle('open');
});
document.addEventListener('click',function(e){ if(!e.target.closest('#verSel')) verSel.classList.remove('open'); });

/* ============================================================
   侧栏导航（树形分支菜单）
   ============================================================ */
const ICONS={
  grid:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  car:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11l1.7-4.2A2 2 0 0 1 8.6 5.5h6.8a2 2 0 0 1 1.9 1.3L19 11"/><rect x="3" y="11" width="18" height="6" rx="2"/><circle cx="7" cy="17" r="1.6"/><circle cx="17" cy="17" r="1.6"/></svg>',
  chip:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>',
  map:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-5.4-2.1V4L9 6.1 15 4l5.4 2.1V18L15 15.9 9 20z"/><path d="M9 6.1V20M15 4v11.9"/></svg>',
  cal:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  season:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14-4"/><path d="M4 5v4h4"/><path d="M4 13a8 8 0 0 0 14 4"/><path d="M20 19v-4h-4"/></svg>',
  cup:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4"/><path d="M6 4h12v5a6 6 0 0 1-12 0z"/><path d="M6 6H4a2 2 0 0 0 2 4M18 6h2a2 2 0 0 1-2 4"/></svg>',
  item:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>',
  medal:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l4 6 4-6"/><circle cx="12" cy="15" r="5"/></svg>',
  book:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  patch:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 21h10M5 7h14M5 7l-2.5 6h5zM19 7l-2.5 6h5z"/></svg>',
  cmp:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 7h4l-2 3 2 3H5"/><path d="M19 7h-4l2 3-2 3h4"/></svg>'
};
const SECTIONS=[
  {title:'车辆库', checked:true, items:[
    {id:'m-veh',label:'车辆总览',icon:ICONS.grid,view:'veh'},
    {id:'m-map',label:'地图',icon:ICONS.map,view:'map'},
    {id:'m-chip',label:'芯片',icon:ICONS.chip,view:'chip'}
  ]},
  {title:'活动与赛事', checked:false, items:[
    {id:'m-act',label:'活动',icon:ICONS.cal,view:'activities'},
    {id:'m-seact',label:'赛季活动',icon:ICONS.season,view:'season'},
    {id:'m-sgod',label:'街头车神',icon:ICONS.cup,view:'street_god'}
  ]},
  {title:'图鉴', checked:false, items:[
    {id:'m-items',label:'道具',icon:ICONS.item,view:'items'},
    {id:'m-titles',label:'称号',icon:ICONS.medal,view:'titles'}
  ]},
  {title:'资料', checked:false, items:[
    {id:'m-intro',label:'游戏介绍',icon:ICONS.book,view:'intro'},
    {id:'m-bal',label:'平衡性更新',icon:ICONS.patch,view:'balance'}
  ]},
  {title:'数据模块', checked:false, items:[
    {id:'m-cmp',label:'版本对比',icon:ICONS.cmp,view:'diff'}
  ]}
];
function branchSVG(n){
  const baseY=14+(n-1)*38;
  let s='<path class="branched-menu__base" d="M 14 0 V '+baseY+'"></path>';
  for(let i=0;i<n;i++){
    const b=14+i*38, e=b+10, len=(b+Math.PI*10/2+8).toFixed(2);
    s+='<path class="branched-menu__base" d="M 14 '+b+' A 10 10 0 0 0 24 '+e+' H 32"></path>';
    s+='<path class="branched-menu__reach" d="M 14 0 V '+b+' A 10 10 0 0 0 24 '+e+' H 32" style="stroke-dasharray:'+len+';stroke-dashoffset:'+len+';"></path>';
  }
  return '<svg class="branched-menu__lines" width="40" height="'+(n*38+12)+'" aria-hidden="true">'+s+'</svg>';
}
function drawReach(radio){
  const sec=radio.closest('.branched-menu__section');
  const reaches=Array.prototype.slice.call(sec.querySelectorAll('.branched-menu__reach'));
  reaches.forEach(function(r){r.style.strokeDashoffset=r.style.strokeDasharray;});
  const items=Array.prototype.slice.call(sec.querySelectorAll('.branched-menu__item'));
  const lbl=document.querySelector('label[for="'+radio.id+'"]');
  const idx=items.indexOf(lbl);
  if(reaches[idx]) reaches[idx].style.strokeDashoffset='0';
}
function buildNav(){
  const nav=$('nav');
  nav.innerHTML=SECTIONS.map(function(sec,si){
    const items=sec.items.map(function(it){
      return '<input type="radio" name="menu-item" id="'+it.id+'" class="item-radio'+((it.view==='veh')?' checked':'')+'" data-view="'+it.view+'">\n'+
      '<label for="'+it.id+'" class="branched-menu__item">'+
      '<span class="branched-menu__icon">'+it.icon+'</span>'+
      '<span class="branched-menu__label">'+it.label+'</span></label>';
    }).join('');
    return '<div class="branched-menu__section">'+
      '<input type="checkbox" id="sec-'+si+'" class="sec-toggle"'+(sec.checked?' checked':'')+'>\n'+
      '<span class="branched-menu__marker" aria-hidden="true"></span>\n'+
      '<label for="sec-'+si+'" class="branched-menu__head">'+sec.title+'</label>'+
      '<div class="branched-menu__body"><div class="branched-menu__fold"><div class="branched-menu__tree">'+
      branchSVG(sec.items.length)+items+'</div></div></div></div>';
  }).join('');
  nav.querySelectorAll('.branched-menu__item').forEach(function(lbl){
    lbl.addEventListener('click',function(){
      const radio=document.getElementById(lbl.getAttribute('for'));
      if(radio) drawReach(radio);
      gotoView(radio.getAttribute('data-view'));
      setNav(false);
    });
  });
}

/* ============================================================
   路由：hash 驱动
   #/veh           车辆列表
   #/veh/:id       车辆详情
   #/map #/chip #/activities #/season #/street_god
   #/items #/titles #/intro #/balance #/diff
   ============================================================ */
let currentView='veh';
let curCarId='';
function parseHash(){
  const h=(location.hash||'').replace(/^#\/?/,'');
  const parts=h.split('/').filter(Boolean);
  return parts;
}
function gotoView(view,id){
  view=view||'veh';
  const path=id!==undefined?'#/'+view+'/'+id:('#/'+view);
  if((location.hash||'')===path){ route(); return; }
  location.hash=path;
}
function setActiveNav(view){
  const radios=document.querySelectorAll('.item-radio');
  radios.forEach(function(r){ r.checked=(r.getAttribute('data-view')===view); });
  const def=document.querySelector('.item-radio:checked');
  if(def) drawReach(def);
}
function route(){
  const parts=parseHash();
  const view=parts[0]||'veh';
  currentView=view;
  curCarId=parts[1]||'';
  setActiveNav(view==='car'?'veh':view);
  document.getElementById('main').scrollTop=0;
  if(view==='veh') return curCarId?renderCar(curCarId):renderVehList();
  if(view==='map') return renderMap();
  if(view==='chip') return renderChip();
  if(view==='diff') return renderDiff();
  return renderMod(view);
}
addEventListener('hashchange',function(){ route(); probeImages(); });
/* 首次加载没有 hashchange，这里补一次探测 */
addEventListener('load',function(){ probeImages(); });
/* 视图内分页 / 翻页后回到顶部，避免停在列表中段 */
function scrollMainTop(){ const m=$('main'); if(m) m.scrollTop=0; }

/* ============================================================
   通用下拉 / 工具栏
   ============================================================ */
function summary(a){ return !a||!a.length?'全部':(a.length===1?a[0]:a.length+' 项'); }
function ddHtml(key,label,items,sel,openDD){
  const open=openDD===key;
  const sum=summary(sel);
  const text=sum==='全部'?label:label+'：'+sum;
  return '<div class="sel'+(open?' open':'')+'" data-dd="'+esc(key)+'">'+
    '<button class="sel-btn" type="button"><span class="ic">'+esc(label.slice(0,1))+'</span>'+
      '<span>'+esc(text)+'</span><span class="arrow">▼</span></button>'+
    '<div class="sel-list">'+items.map(function(it){
      return '<div class="opt'+(sel.indexOf(it.v)>=0?' on':'')+'" data-k="'+esc(key)+'" data-v="'+esc(it.v)+'">'+
        '<span>'+esc(it.n)+'</span><span class="hint">'+it.c+'</span></div>';
    }).join('')+'</div></div>';
}
function searchHTML(id,ph,kw){
  return '<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'+
    '<input id="'+id+'" placeholder="'+esc(ph)+'" value="'+esc(kw)+'" autocomplete="off"></div>';
}
function bindToolbar(el,onInput,onFilter,onSort,onModal){
  const tb=el.querySelector('.toolbar');
  if(tb) tb.addEventListener('click',function(e){
    const sb=e.target.closest('.sel-btn');
    if(sb){
      const drop=sb.parentNode;
      if(drop.dataset.kind==='sort'){ if(onSort) onSort(drop); return; }
      const open=!drop.classList.contains('open');
      tb.querySelectorAll('.sel').forEach(d=>d.classList.remove('open'));
      if(open) drop.classList.add('open');
      return;
    }
    const opt=e.target.closest('.opt');
    if(opt&&onFilter){ onFilter(opt.dataset.k,opt.dataset.v,opt); return; }
  });
  const q=el.querySelector('#'+(el.dataset.qid||'q'));
  if(q) q.addEventListener('input',function(){ if(onInput) onInput(this.value); });
}
document.addEventListener('click',function(e){
  if(!e.target.closest('.sel')) document.querySelectorAll('.sel.open').forEach(d=>d.classList.remove('open'));
});

/* ============================================================
   弹层
   ============================================================ */
const maskEl=$('mask'), modalEl=$('modal');
function openModal(html){
  modalEl.innerHTML=html;
  maskEl.classList.add('open');
  const c=modalEl.querySelector('.mclose');

async function loadVehicles(){
  if(CAR_INDEX.length) return;
  const data=await fetchData(CUR_VER,'vehicles.json');
  CAR_FULL=Object.create(null);
  const list=[];
  Object.keys(data).forEach(function(k){
    const rec=data[k]&&data[k]['车辆档案']?data[k]['车辆档案']:data[k];
    if(!rec||typeof rec!=='object') return;
    const b=rec['基础']||{}, t=rec['车辆缩略图']||{};
    const id=b['数据ID'];
    CAR_FULL[String(id)]=rec;
    list.push({
      id:id, name:b['名称']||('ID '+id), maker:b['厂商'],
      camp:b['阵营'], role:b['定位'], track:b['赛道专精'], drive:b['驱动方式'],
      grade:b['品级'], skill:b['技能简述'],
      thumb:t['图标b']||t['图标m']||t['图标s']||'',
      season:b['所属赛季']||'', get:b['获取方式']||'', date:b['注册日期']||''
    });
  });
  list.sort((a,b)=>(a.id||0)-(b.id||0));
  CAR_INDEX=list;
  const foot=$('sideFoot');
  foot.textContent='数据 '+CUR_VER+' · '+CAR_INDEX.length+' 辆车辆 · 全站数据';
  probeImages();
}
function vehItems(){
  const kw=vehKeyword.trim().toLowerCase();
  const list=CAR_INDEX.filter(function(c){
    if(kw){ const hay=(c.name+' '+(c.maker||'')+' '+(c.skill||'')).toLowerCase(); if(hay.indexOf(kw)<0) return false; }
    if(vehCamp!=='全部'&&c.camp!==vehCamp) return false;
    if(vehRole!=='全部'&&c.role!==vehRole) return false;
    if(vehGrade!=='全部'&&String(c.grade)!==vehGrade) return false;
    return true;
  });
  const idOf=x=>Number(x.id)||0;
  if(vehSort==='ID 小→大') list.sort((a,b)=>idOf(a)-idOf(b));
  else if(vehSort==='ID 大→小') list.sort((a,b)=>idOf(b)-idOf(a));
  else if(vehSort==='品级 高→低') list.sort((a,b)=>(Number(b.grade)||0)-(Number(a.grade)||0)||idOf(a)-idOf(b));
  else list.sort((a,b)=>String(a.name).localeCompare(String(b.name),'zh'));
  return list;
}

function bindVehList(el){
  el.querySelectorAll('.vcard').forEach(function(card,idx){

function stat(k,v,unit,raw){
  if(v===undefined||v===null||v==='') return '';
  return '<div class="stat"'+(raw!==undefined&&raw!==null&&raw!==''?' title="原始值 '+esc(raw)+'"':'')+'>'+
    '<div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+(unit?'<small> '+unit+'</small>':'')+'</div></div>';
}
function kv(k,v){ return '<div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div>'; }
function sortNodes(nodes){
  if(!Array.isArray(nodes)) return [];
  return nodes.slice().sort(function(a,b){
    const aJ=(a.判断节点ID!==undefined||a.条件!==undefined)?1:0, bJ=(b.判断节点ID!==undefined||b.条件!==undefined)?1:0;
    if(aJ!==bJ) return aJ-bJ;
    const aN=String(a.节点名||a.条件||''), bN=String(b.节点名||b.条件||'');
    if(aN!==bN) return aN.localeCompare(bN,'zh');
    return (a.节点ID||a.判断节点ID||0)-(b.节点ID||b.判断节点ID||0);
  });
}
function nodePairs(n){
  const pairs=[];
  for(const k in n){
    if(String(k).charAt(0)==='_') continue;
    if(['节点名','节点ID','判断节点ID','条件','分支','效果节点'].indexOf(k)>=0) continue;
    if(/是否携带|芯片/.test(k)) continue;
    const val=n[k];
    if(k==='描述'&&(!val||/\{.*\}/.test(val))) continue;
    if(Array.isArray(val)) continue;
    pairs.push([k,val]);
  }
  return pairs;
}
const hiddenNode=n=>/是否携带|芯片/.test(String(n.节点名||n.条件||''));
function nodeSig(n){ return JSON.stringify([n.节点名||n.条件||'节点',nodePairs(n)]); }
function dedupeNodes(list){
  if(!Array.isArray(list)) return [];
  const seen={}, out=[];
  list.forEach(function(n){
    if(!n||hiddenNode(n)) return;
    const s=nodeSig(n);
    if(seen[s]){ seen[s]._dup++; return; }
    const c=Object.assign({},n); c._dup=1; seen[s]=c; out.push(c);
  });
  return out;
}
function renderNode(n){
  if(!n) return '';
  const title=n.节点名||n.条件||'节点', id=(n.节点ID!==undefined?n.节点ID:n.判断节点ID);
  if(hiddenNode(n)) return '';
  const pairs=nodePairs(n);
  if(!pairs.length) return '';
  const dup=n._dup>1?'<small class="dup" title="另有 '+(n._dup-1)+' 个内容完全相同的节点已隐藏">×'+n._dup+'</small>':'';
  return '<div class="node sub"><div class="nt">'+esc(title)+(id!==undefined?' <small style="color:var(--muted)">#'+esc(id)+'</small>':'')+dup+'</div>'+
    '<div class="kv">'+pairs.map(p=>kv(p[0],p[1])).join('')+'</div></div>';
}

      info+='<div class="rel-group"><div class="rl">适配</div><div class="chips">'+

    if(rel.被克制&&rel.被克制.length)
      info+='<div class="rel-group"><div class="rl">被克制</div><div class="chips">'+
        rel.被克制.map(n=>relChip(n,'bad')).join('')+'</div></div>';
    info+='</div>';
  }

  if(c.故事) info+='<div class="card"><div class="sec-title">车辆故事</div><p class="desc" style="margin-top:0">'+esc(c.故事)+'</p></div>';

  const main=$('main');
  main.innerHTML='<div class="back" id="vback"><span class="ar">←</span> 返回车辆</div>'+
    '<div class="detail-wrap"><div class="col-info">'+info+'</div>'+mediaCol+'</div>';
  document.title=(b.名称?b.名称+' · ':'')+'车辆档案库';
  $('vback').onclick=function(){ gotoView('veh'); };
  const hero=$('hero-pic');
  if(hero) document.querySelectorAll('.mini').forEach(function(m){
    m.onclick=function(){
      document.querySelectorAll('.mini').forEach(x=>x.classList.remove('on'));
      m.classList.add('on');
      document.getElementById('hero-name').textContent=m.getAttribute('data-name')||'原皮';
      /* 同步切换大图：换皮肤时主图跟着换 */
      const f=m.getAttribute('data-img');

      if(!im){
        im=document.createElement('img');

        hero.appendChild(im);

      im.style.opacity='0';
      im.alt=m.getAttribute('data-name')||'';
      im.src=IMG_BASE+f;
      if(im.complete&&im.naturalWidth) im.style.opacity='1';
    };
  });

let SEASON_START=null;
function seasonStarts(){
  if(SEASON_START) return SEASON_START;
  SEASON_START={};
  const g=AUX_CACHE['street_god.json'];
  if(g){
    const arr=Array.isArray(g)?g:Object.values(g);
    arr.forEach(function(x){
      const s=x['赛季'], t=timeKey(x);
      if(!s||!t) return;
      if(SEASON_START[s]==null||t<SEASON_START[s]) SEASON_START[s]=t;
    });
  }
  return SEASON_START;
}
function fmtSeasonTime(code){
  const m=String(code||'').match(/^S(\d+)_WEEK(\d+)/i);
  if(!m) return null;
  const season='S'+m[1], week=Number(m[2]);
  const label=season+' 第'+week+'周';
  const st=seasonStarts()[season];
  if(!st) return label;
  const d=new Date(st+(week-1)*7*86400000);
  return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate())+' · '+label;
}

    filters:[{key:'品质',get:r=>r.rarityLabel||''},{key:'类别',get:r=>r.typeGroup||''}]},
  game_intro:{file:'game_intro.json',title:'游戏介绍',unit:'篇',kind:'read',sortRaw:(a,b)=>Number(b['数据ID'])-Number(a['数据ID']),

    sections:r=>{

      return o},
    filters:[]}

const VIEW2MOD={'activities':'activities','season':'season_activities','street_god':'street_god','items':'items','titles':'titles','intro':'game_intro','balance':'balance_updates'};

function renderMod(view){

function ModView(modName,mainEl){
  const MOD=MODS[modName];
  let RAW=[],ITEMS=[],keyword='',sortKey='default',openDD=null,page=1,selChip=null;
  const filters={};
  fetchData(CUR_VER,MOD.file).then(function(data){
    RAW=Array.isArray(data)?data:Object.keys(data).map(k=>data[k]);
    /* 物品图字段无文件后缀（如 item_gold_01_m），按车辆同款命名惯例补 .png，否则 pickImg 识别不出、永远显示占位 */
    if(modName==='items'){
      RAW.forEach(function(r){
        ['icon','iconSmall','iconAlt'].forEach(function(k){
          var v=r[k];
          if(typeof v==='string'&&v&&!IMG_EXT.test(v)) r[k]=v+'.png';
        });
      });
    }
    return (MOD.aux?Promise.all(MOD.aux.map(function(f){
      return fetchData(CUR_VER,f).then(function(d){AUX_CACHE[f]=d;}).catch(function(){AUX_CACHE[f]=null;});
    })):Promise.resolve()).then(function(){ return data; });
  }).then(function(){
    build();
    /* 每个模块各探测一次图片：拿到第一条有图的文件名试一下 */
    const p=ITEMS.find(function(x){ return pickImg(x.raw); });
    if(p) probeNS(modName,pickImg(p.raw));
    render();
  }).catch(function(err){
    mainEl.innerHTML='<div class="empty"><div class="big">载入失败</div><div class="err">'+esc(err.message)+'</div>'+
      '<div style="font-size:12px">请确认 <code>ace/'+esc(CUR_VER)+'/'+esc(MOD.file)+'</code> 可访问。</div></div>';
  });
  function build(){
    if(MOD.sortRaw) RAW=RAW.slice().sort(MOD.sortRaw);
    if(MOD.kind==='list'){
      ITEMS=RAW.map(r=>{const n=MOD.row(r);n.raw=r;n._s=(n.name+' '+(n.tags||[]).join(' ')+' '+n.meta.map(x=>x[1]).join(' ')).toLowerCase();return n});
    } else if(MOD.kind==='grid'){
      ITEMS=RAW.map(r=>{const c=MOD.card(r);c.raw=r;c._s=(c.name+' '+c.type+' '+c.rarity).toLowerCase();return c});
    } else if(MOD.kind==='read'){
      ITEMS=RAW.map(r=>{const h=MOD.head(r);h.raw=r;h._s=(h.name+' '+h.sub).toLowerCase();return h});
    } else if(MOD.kind==='season'){
      const flat=[];
      RAW.forEach(g=>(MOD.groupList?MOD.groupList(g):(g['活动列表']||[])).forEach(a=>flat.push(MOD.flat(g,a))));
      ITEMS=flat.map(r=>{const c=MOD.card(r);c.raw=r;
        c._s=(c.name+' '+r['赛季']+' '+r['状态']+' '+r['时间']+' #'+r['ID']).toLowerCase();return c;});
      if(MOD.chipSingle){
        const vals=chipValues();
        selChip=(MOD.defaultChip&&vals.indexOf(MOD.defaultChip)>=0)?MOD.defaultChip:(vals[0]||null);
      }
    } else { ITEMS=[]; }
    MOD.filters.forEach(f=>{ if(f.key!==MOD.chipFilter) filters[f.key]=[]; });
    if(MOD.chipFilter && !MOD.chipSingle) filters[MOD.chipFilter]=[];
  }
  function chipValues(){
    const f=MOD.filters.filter(x=>x.key===MOD.chipFilter)[0];
    if(!f) return [];
    return counts(f).map(x=>x.v);
  }
  function counts(f){
    const m={};
    if(MOD.kind==='season' && f.key===MOD.chipFilter){
      RAW.forEach(g=>{
        const k=f.get(g); if(k==null||k==='')return;
        const list=(MOD.groupList?MOD.groupList(g):(g['活动列表']||[]));
        m[k]=(m[k]||0)+list.length;
      });
    } else {
      ITEMS.forEach(it=>{const v=f.get(it.raw||it);if(v==null||v==='')return;m[v]=(m[v]||0)+1});
    }
    let ks=Object.keys(m);
    ks=MOD.valueOrder?MOD.valueOrder(ks):ks.sort((a,b)=>m[b]-m[a]);
    return ks.map(k=>({v:k,c:m[k],n:k}));
  }
  function toolbar(count){
    const sortLabel=sortKey==='name'?'名称':(sortKey==='id'?'ID 小→大':(MOD.sortLabel||'默认排序'));
    const sortBtn=(MOD.kind==='list'||MOD.kind==='season')?'<div class="sel" data-kind="sort"><button class="sel-btn" type="button" data-sort="1"><span class="ic">排</span>'+
      '<span>'+esc(sortLabel)+'</span><span class="arrow">▼</span></button></div>':'';
    let drops='',chips='';
    MOD.filters.forEach(f=>{
      const opts=counts(f);
      if(MOD.chipFilter===f.key){
        chips+='<div class="chips">'+opts.map(it=>{
          const on=MOD.chipSingle?(selChip===it.v):(filters[f.key].indexOf(it.v)>=0);
          return '<button type="button" class="chipbtn'+(on?' on':'')+'" data-k="'+esc(f.key)+'" data-v="'+esc(it.v)+'">'+esc(it.n)+'<small>'+it.c+'</small></button>';
        }).join('')+'</div>';
      } else {
        drops+=ddHtml(f.key,f.key,opts,filters[f.key],openDD);
      }
    });
    return '<div class="toolbar" data-qid="mq"><div class="trow"><h2>'+esc(MOD.title)+'<span class="count">'+count+'</span></h2>'+
      '<div class="selects">'+drops+sortBtn+'</div>'+
      searchHTML('mq','搜索…',keyword)+'</div>'+
      chips+'</div>';
  }
  function rowHtml(n){
    /* 列表行首补一张 22px 小图标，让表格视图也能一眼认出条目 */
    const ic=pickImg(n.raw);
    return '<div class="row" data-id="'+esc(n.id)+'"><div class="hd">'+
      '<span class="row-ic">'+cimg(ic,n.name,modName)+'</span><span class="nm">'+esc(n.name)+'</span>'+
      (n.tags||[]).filter(Boolean).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div>'+
      (n.meta&&n.meta.length?'<div class="meta">'+n.meta.filter(x=>x[1]!=null&&x[1]!=='').map(x=>'<span class="kv"><i>'+esc(x[0])+'</i><b>'+esc(x[1])+'</b></span>').join('')+'</div>':'')+
      '</div>';
  }
  function pass(it,f){ const sel=filters[f.key]; return !(sel&&sel.length)||sel.indexOf(String(f.get(it.raw||it)))>=0; }
  function filteredList(){
    const q=keyword.trim().toLowerCase();
    let list=ITEMS.filter(it=>{
      if(q&&it._s.indexOf(q)<0)return false;
      for(const f of MOD.filters){ if(f.key===MOD.chipFilter) continue; if(!pass(it,f)) return false; }
      return true;
    });
    if(MOD.kind==='season'){
      if(selChip) list=list.filter(it=>String(it.raw['赛季'])===selChip);
      if(sortKey==='id') list=list.slice().sort((a,b)=>(a.id||0)-(b.id||0));
      else if(sortKey==='name') list=list.slice().sort((a,b)=>a.name.localeCompare(b.name,'zh-Hans-CN'));
      else list=list.slice().sort((a,b)=>(timeKey(b.raw)-timeKey(a.raw))||((a.id||0)-(b.id||0)));
    }
    if(MOD.kind==='list'){
      if(sortKey==='id') list=list.slice().sort((a,b)=>(a.id||0)-(b.id||0));
      else if(sortKey==='name') list=list.slice().sort((a,b)=>a.name.localeCompare(b.name,'zh-Hans-CN'));
    }
    return list;

      '<div class="box"><span class="ph">'+esc(initial(c.name))+'</span>'+cimg(pickImg(c.raw),c.name,modName)+'</div>'+
      '<div class="nm">'+esc(c.name)+'</div>'+(c.rarity?'<div class="rl">'+esc(c.rarity)+'</div>':'')+'</div>';

        (st?'<span class="stat '+stc+'">'+esc(st)+'</span>':'')+
      '</div>'+
      '<div class="abody"><div class="anm" title="'+esc(c.name)+'">'+esc(c.name)+'</div>'+
        '<div class="ameta"><span class="ai">#'+esc(id)+'</span><span class="at" title="'+esc(full)+'">'+esc(full||'—')+'</span></div>'+
      '</div></div>';

  function fillArt(el,id){

      h+='<div class="sec"><h4>'+esc(s.title||'—')+'</h4>'+((s.body||[]).filter(Boolean).map(b=>'<div class="rich">'+rich(b)+'</div>').join(''))+'</div>';
    });
    if(MOD.cards){ (MOD.cards(r)||[]).forEach(sec=>{
      h+='<div class="sec"><h4>'+esc(sec.title)+'</h4><div class="adjs">'+(sec.items||[]).map(it2=>
        '<div class="adj"><div class="adj-hd"><span class="nm">'+esc(it2.name||'—')+'</span>'+
          (it2.tag?'<span class="tag on">'+esc(it2.tag)+'</span>':'')+'</div>'+
        (it2.fields||[]).filter(f=>f[1]!=null&&f[1]!=='').map(f=>'<div class="adj-row"><span class="lb">'+esc(f[0])+'</span><div class="tx">'+rich(f[1])+'</div></div>').join('')+

  function openDetail(n){
    const r=n.raw||{};

    }).map(k=>{

    } else if(MOD.kind==='season'){
      const list=filteredList();
      const per=MOD.paged||60, pages=Math.max(1,Math.ceil(list.length/per));

  function bind(){
    const tb=mainEl.querySelector('.toolbar');
    if(tb) tb.addEventListener('click',function(e){
      const sb=e.target.closest('.sel-btn');
      if(sb){
        const drop=sb.parentNode;
        if(drop.dataset.kind==='sort'){ const o=['default','name','id']; sortKey=o[(o.indexOf(sortKey)+1)%o.length]; render(); return; }
        const open=!drop.classList.contains('open');

      }

      if(chip){

        else { const arr=filters[k]; const i=arr.indexOf(v); if(i>=0)arr.splice(i,1);else arr.push(v); }
        page=1; render(); return;
      }
      const opt=e.target.closest('.opt');
      if(opt){ const k=opt.dataset.k,v=opt.dataset.v,arr=filters[k]; const i=arr.indexOf(v); if(i>=0)arr.splice(i,1);else arr.push(v); openDD=k; page=1; render(); return; }
    });
    const q=mainEl.querySelector('#mq');
    if(q) q.addEventListener('input',function(){ keyword=this.value; page=1; const pos=this.selectionStart; render(); const n=mainEl.querySelector('#mq'); if(n){ n.focus(); n.setSelectionRange(pos,pos); } });
    if(MOD.kind==='list'){
      const rows=mainEl.querySelector('.rows');
      if(rows) rows.addEventListener('click',e=>{ const row=e.target.closest('.row'); if(!row)return; const n=ITEMS.find(x=>String(x.id)===row.dataset.id); if(n) openDetail(n); });
    }
    if(MOD.kind==='grid'){
      const g=mainEl.querySelector('.grid'); if(g) g.addEventListener('click',e=>{ const c=e.target.closest('.icard'); if(!c)return; const it=RAW.find(x=>String(x.id)===c.dataset.id); if(it) openDetail({name:it.name,raw:it}); });
      const pg=mainEl.querySelector('.pager'); if(pg) pg.addEventListener('click',e=>{ const b=e.target.closest('[data-pg]'); if(!b)return; page+=(b.dataset.pg==='next'?1:-1); render(); });
    }
    if(MOD.kind==='season'){
      const g=mainEl.querySelector('.grid.act');
      if(g) g.addEventListener('click',e=>{ const c=e.target.closest('.acard'); if(!c)return; const it=ITEMS.find(x=>String(x.id)===c.dataset.id); if(it) openDetail(it); });
      const pg=mainEl.querySelector('.pager'); if(pg) pg.addEventListener('click',e=>{ const b=e.target.closest('[data-pg]'); if(!b)return; page+=(b.dataset.pg==='next'?1:-1); render(); });
    }
    if(MOD.kind==='read'){
      mainEl.querySelectorAll('.art').forEach(a=>a.querySelector('.art-hd').addEventListener('click',()=>{
        const open=a.classList.toggle('open'); if(open) fillArt(a.querySelector('.art-bd'),a.dataset.id);
      }));
    }
  }
}

let TRACKS=[];
let mapKeyword='', mapRegion=[], mapLaps=[];
let mapSort='id';
function renderMap(){
  const main=$('main');
  main.innerHTML='<div class="loading"><div class="spin"></div><div>正在载入地图数据…</div></div>';
  fetchData(CUR_VER,'tracks.json').then(function(data){
    TRACKS=[];
    Object.keys(data).forEach(function(k){
      const rec=data[k];
      if(!rec||typeof rec!=='object') return;
      const laps=Array.isArray(rec['圈数'])?rec['圈数']:[];
      TRACKS.push({
        id:rec['数据ID'], name:rec['名称']||('ID '+rec['数据ID']), pc:rec['PC端名称']||'',
        region:rec['所在地']||'', laps:laps, lapsTxt:laps.join('/')||'—',
        thr:rec['最快计时门槛'],
        img:pickImg(rec),
        space:Array.isArray(rec['空间ID'])?rec['空间ID']:[].concat(rec['空间ID']||[])
      });
    });
    TRACKS.forEach(c=>{ c._s=(c.name+' '+c.pc+' '+c.region+' '+c.lapsTxt).toLowerCase(); });
    const tp=TRACKS.find(function(c){ return c.img; }); if(tp) probeNS('map',tp.img);
    renderMapGrid(main);
  }).catch(function(err){
    main.innerHTML='<div class="empty"><div class="big">地图数据载入失败</div><div class="err">'+esc(err.message)+'</div></div>';
  });
}
function mapCounts(get){
  const m={};
  TRACKS.forEach(c=>{ const v=get(c); if(v==null||v==='')return; m[v]=(m[v]||0)+1; });
  return Object.keys(m).sort((a,b)=>m[b]-m[a]).map(k=>({v:k,c:m[k],n:k}));
}
function mapFiltered(){
  const q=mapKeyword.trim().toLowerCase();
  const list=TRACKS.filter(function(c){
    if(q&&c._s.indexOf(q)<0) return false;
    if(mapRegion.length&&mapRegion.indexOf(c.region)<0) return false;
    if(mapLaps.length&&mapLaps.indexOf(c.lapsTxt)<0) return false;
    return true;
  });
  if(mapSort==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hans-CN'));
  else if(mapSort==='thr') list.sort((a,b)=>(a.thr||0)-(b.thr||0)||a.name.localeCompare(b.name,'zh-Hans-CN'));
  else list.sort((a,b)=>(a.id||0)-(b.id||0));
  return list;
}

let CHIPS=[];
let chipKeyword='', chipShape=[], chipQuality=[], chipType=[];
let chipSort='qid';
const CHIP_SORTS=[{k:'qid',n:'品质 高→低'},{k:'name',n:'名称'},{k:'id',n:'ID 小→大'}];
const QUAL={1:['普通','#6b7280'],2:['稀有','#2563eb'],3:['史诗','#9333ea'],4:['传说','#d97706']};
const qual=id=>QUAL[+id]||['未知','#9aa6bd'];
const fmtNum=v=>{ const n=Number(v); return isFinite(n)?(Math.round(n*1000)/1000).toString():String(v==null?'':v); };
const tplHtml=tpl=>esc(tpl).replace(/\{0\}|\{\}/g,'<span class="ph0">{0}</span>');
const effRange=(tpl,lo,hi)=>{
  const v=(lo==null||hi==null||lo===hi)?('<b>'+esc(fmtNum(lo==null?hi:lo))+'</b>')
    :('<b>'+esc(fmtNum(lo))+'</b><span class="arr">→</span><b>'+esc(fmtNum(hi))+'</b>');
  return String(tpl||'').replace(/\{0\}|\{\}/g,v);
};
const nameHtml=name=>{
  const m=String(name||'').match(/^(.*?)([·・]\S{1,2})$/);
  return m?(esc(m[1])+'<span class="nm-sym">'+esc(m[2])+'</span>'):esc(name);
};
function renderChip(){
  const main=$('main');
  main.innerHTML='<div class="loading"><div class="spin"></div><div>正在载入芯片数据…</div></div>';
  fetchData(CUR_VER,'chips.json').then(function(data){
    CHIPS=[];
    Object.keys(data).forEach(function(k){
      const rec=data[k]&&data[k]['芯片档案']?data[k]['芯片档案']:data[k];
      if(!rec||typeof rec!=='object') return;
      const b=rec['基础']||{};
      const eff=(rec['效果']||[])[0]||null;
      const lv=(eff&&eff['等级数值'])||[];
      CHIPS.push({
        id:b['数据ID'], name:b['名称']||('ID '+b['数据ID']),
        shape:b['形状']||'', quality:b['品质']||'', qid:+b['品质ID']||0,
        type:b['类型']||'', cat:b['分类']||'', attr:b['属性']||'',
        tpl:(eff&&eff['模板'])||'', levels:lv,
        lo:lv.length?lv[0].数值:null, hi:lv.length?lv[lv.length-1].数值:null
      });
    });
    CHIPS.forEach(c=>{ c._s=(c.name+' '+c.cat+' '+c.attr+' '+c.shape+' '+c.type).toLowerCase(); });
    renderChipGrid(main);
  }).catch(function(err){
    main.innerHTML='<div class="empty"><div class="big">芯片数据载入失败</div><div class="err">'+esc(err.message)+'</div></div>';
  });
}
function chipCounts(get){
  const m={};
  CHIPS.forEach(c=>{ const v=get(c); if(v==null||v==='')return; m[v]=(m[v]||0)+1; });
  return Object.keys(m).sort(function(a,b){ return m[b]-m[a]; }).map(k=>({v:k,c:m[k],n:k}));
}
function chipFiltered(){
  const q=chipKeyword.trim().toLowerCase();
  const list=CHIPS.filter(function(c){
    if(q && c._s.indexOf(q)<0) return false;
    if(chipShape.length&&chipShape.indexOf(c.shape)<0) return false;
    if(chipQuality.length&&chipQuality.indexOf(c.quality)<0) return false;
    if(chipType.length&&chipType.indexOf(c.type)<0) return false;
    return true;
  });
  if(chipSort==='qid') list.sort((a,b)=>b.qid-a.qid||a.id-b.id);
  else if(chipSort==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hans-CN'));
  else list.sort((a,b)=>(a.id||0)-(b.id||0));
  return list;
}
function chipCardHTML(c){
  const q=qual(c.qid);
  return '<div class="chip tap" tabindex="0" data-id="'+esc(c.id)+'" style="--q:'+q[1]+'">'+
    '<div class="chip-hd"><span class="glyph">'+shapeSVG(c.shape)+'</span>'+

    '</div>';
}
function renderChipGrid(mainEl){
  const list=chipFiltered();

          '<span class="arrow">▼</span></button></div>'+
      '</div>'+
      searchHTML('cq','搜索芯片名 / 分类…',chipKeyword)+

      '<div class="mgrid">'+kv([['品质',c.quality],['形状',shapeShort(c.shape)],['分类',c.cat],['属性',c.attr],['类型',c.type],['数据 ID',c.id]])+'</div>'+

/* 关键词过滤：纯前端，不重新请求 */

/* ---- 轻量递归 diff：结构 / [旧,新] ---- */
function diffValue(a,b){
  if(a===b) return null;
  if(a===undefined||a===null) return [a,b];
  if(b===undefined||b===null) return [a,b];
  const ta=typeof a, tb=typeof b;
  if(ta!=='object'||tb!=='object') return [a,b];
  if(Array.isArray(a)!==Array.isArray(b)) return [a,b];
  if(Array.isArray(a)) return diffArray(a,b);
  const out={};
  const keys=Object.keys(a).concat(Object.keys(b).filter(k=>!(k in a)));
  keys.forEach(function(k){
    const d=diffValue(a[k],b[k]);
    if(d!==null) out[k]=d;
  });
  return Object.keys(out).length?out:null;
}
/* 数组元素匹配键：优先唯一ID类字段（跨版本稳定）；无ID则 名称/赛季+出现序号，
   保证重复元素（如多场红包雨）一一对应，不会错位配对造成虚假的"ID变了/新增" */
function elemKey(x, occ){
  if(x&&typeof x==='object'){
    for(const f of ['数据ID','技能ID','皮肤ID','版本ID','id','编号','ID','期次']){
      if(x[f]!==undefined) return 'f:'+String(x[f]);
    }
    const base=(x['名称']!==undefined?x['名称']:(x['name']!==undefined?x['name']:(x['赛季']!==undefined?x['赛季']:'#')))||'#';
    return 'n:'+base+':'+occ;
  }
  return 'i:'+occ;
}
function diffArray(a,b){
  const mapB={}, found={}, out={added:[],deleted:[],modified:[]};
  /* b 侧：多值映射 key -> index[]；无ID类字段的元素按出现次数编号 */
  const seen={};
  b.forEach(function(x,i){
    let k=elemKey(x,0);
    if(k.indexOf('n:')===0){
      seen[k]=(seen[k]||0)+1;
      k='n:'+(x&&(x['名称']!==undefined?x['名称']:(x['name']!==undefined?x['name']:(x['赛季']!==undefined?x['赛季']:'#')))||'#')+':'+seen[k];
    }
    (mapB[k]=mapB[k]||[]).push(i);
  });
  const seenA={};
  a.forEach(function(x,i){
    let k=elemKey(x,0);
    if(k.indexOf('n:')===0){
      seenA[k]=(seenA[k]||0)+1;
      k='n:'+(x&&(x['名称']!==undefined?x['名称']:(x['name']!==undefined?x['name']:(x['赛季']!==undefined?x['赛季']:'#')))||'#')+':'+seenA[k];
    }
    const list=mapB[k]||[];
    if(list.length){
      const bi=list.shift(); found[bi]=true;
      const d=diffValue(x,b[bi]);
      if(d) out.modified.push({key:k,name:x&&(x['名称']||x['name']),left:x,right:b[bi],delta:d});
    } else out.deleted.push({key:k,name:x&&(x['名称']||x['name'])});
  });
  b.forEach(function(x,i){ if(!found[i]) out.added.push({key:i,name:x&&(x['名称']||x['name'])}); });
  if(!out.added.length&&!out.deleted.length&&!out.modified.length) return null;
  return out;
}
function analyzeFile(av,bv,cfg){
  const isArr=Array.isArray(av);
  if(isArr){
    return diffArray(av,bv);
  }
  const out={added:[],deleted:[],modified:[]};
  const aKeys=Object.keys(av||{}), bKeys=Object.keys(bv||{}), bSet={};
  bKeys.forEach(k=>bSet[k]=1);
  aKeys.forEach(function(k){
    if(!bSet[k]){ out.deleted.push({key:k,name:cfg.getName(av[k])}); }
    else {
      const d=diffValue(av[k],bv[k]);
      if(d) out.modified.push({key:k,name:cfg.getName(bv[k]),left:av[k],right:bv[k],delta:d});
    }
  });
  bKeys.forEach(function(k){ if(aKeys.indexOf(k)<0) out.added.push({key:k,name:cfg.getName(bv[k])}); });
  return out;
}
function countLeaf(d){
  if(!d||typeof d!=='object') return 0;
  if(Array.isArray(d)) return d.length===2||d.length===1?1:0;
  if((d.added&&d.added.length)||(d.deleted&&d.deleted.length)||(d.modified&&d.modified.length)) return d.added.length+d.deleted.length+d.modified.length;
  let n=0; for(const k in d){ if(Object.prototype.hasOwnProperty.call(d,k)) n+=countLeaf(d[k]); }
  return n;
}
/* ---- 渲染 ---- */
function fval(v){
  if(v===null||v===undefined) return '';
  if(typeof v==='string') return v;
  try{ return JSON.stringify(v); }catch(e){ return String(v); }
}
function cleanKey(k){ return String(k).replace(/^[fn]:/,'').replace(/:([^:]+)$/,''); }
const CAT_PRIO=['基础','核心性能','氮气','大招','SP技能','被动','RELATION','芯片','车辆皮肤','故事','车辆缩略图'];
const CAT_NAMES={'RELATION':'克制关系','核心性能':'核心性能','SP技能':'SP技能','车辆缩略图':'缩略图'};
function listCats(rec){
  if(!rec||typeof rec!=='object')return [];
  for(const c of ['车辆档案','芯片档案']){ const x=rec[c];
    if(x&&typeof x==='object'&&!Array.isArray(x)&&Object.keys(x).length) return Object.keys(x); }
  return Object.keys(rec);
}
function catVal(rec,cat){
  if(!rec||typeof rec!=='object')return undefined;
  for(const c of ['车辆档案','芯片档案']){ const x=rec[c]; if(x&&cat in x) return x[cat]; }
  return rec[cat];
}
function renderLeafRow(path,d){
  if(Array.isArray(d)&&d.length===2){
    const oldV=d[0],newV=d[1];
    return '<div class="frow"><div class="fk">'+esc(path)+'</div><div class="fv fpair">'+
      '<span class="pv old">'+esc2(trunc(fval(oldV),180))+'</span><span class="arrow">→</span>'+
      '<span class="pv new">'+esc2(trunc(fval(newV),180))+'</span></div></div>';
  }
  if(Array.isArray(d)&&d.length===1){
    return '<div class="frow"><div class="fk">'+esc(path)+'</div><div class="fv"><span class="ff new">'+esc2(trunc(fval(d[0]),180))+'</span></div></div>';
  }
  return '';
}
const esc2=esc;
function trunc(s,n){ s=String(s); return s.length>n ? s.slice(0,n)+'…' : s; }
/* 把嵌套 diff 打平成「字段 / 旧 / 新」三元组，供表格化展示 */
function pushDeltaRows(d,path,out){
  if(!d) return out;
  if(Array.isArray(d)){
    if(d.length>=2) out.push({k:path,o:d[0],n:d[1]});
    else if(d.length===1) out.push({k:path,o:null,n:d[0]});
    return out;
  }
  if(d.added||d.deleted||d.modified){
    const nm=x=>x.name||('#'+cleanKey(x.key));
    const parts=[];
    if(d.added&&d.added.length) parts.push('新增 '+d.added.length+' 项 · '+d.added.slice(0,6).map(nm).join('、')+(d.added.length>6?' 等':''));
    if(d.deleted&&d.deleted.length) parts.push('删除 '+d.deleted.length+' 项 · '+d.deleted.slice(0,6).map(nm).join('、')+(d.deleted.length>6?' 等':''));
    if(d.modified&&d.modified.length) parts.push('其中修改 '+d.modified.length+' 项');
    out.push({k:path||'（列表）',o:null,n:parts.join('；')});
    (d.modified||[]).slice(0,20).forEach(function(m){
      pushDeltaRows(m.delta,(path?path+' · ':'')+(m.name||('#'+cleanKey(m.key))),out);
    });
    return out;
  }
  Object.keys(d).forEach(function(k){ pushDeltaRows(d[k], path?path+'.'+k:k, out); });
  return out;
}
function buildCats(item){
  const l=item&&item.left, r=item&&item.right, seen={}, cats=[];
  listCats(l).concat(listCats(r)).forEach(function(c){ if(!seen[c]){ seen[c]=1; cats.push(c); } });
  const out=[];
  cats.forEach(function(cat){
    const d=diffValue(catVal(l,cat),catVal(r,cat));
    if(d){ const n=countLeaf(d); if(n>0) out.push({cat:cat,delta:d,count:n}); }
  });
  out.sort(function(a,b){ const i=CAT_PRIO.indexOf(a.cat), j=CAT_PRIO.indexOf(b.cat); return (i<0?99:i)-(j<0?99:j); });
  return out;
}
function runDiff(){
  const body=$('diffBody'), sumEl=$('diffSummary');
  if(!body) return;
  const va=diffA, vb=diffB;
  body.innerHTML='<div class="loading"><div class="spin"></div><div>正在对比 '+esc(va)+' → '+esc(vb)+'…</div></div>';
  if(sumEl) sumEl.innerHTML='';
  Promise.all(DIFF_FILES.map(function(cfg){
    return Promise.all([fetchData(va,cfg.file).catch(()=>null), fetchData(vb,cfg.file).catch(()=>null)]).then(function(res){
      const av=res[0], bv=res[1];
      const r=analyzeFile(av,bv,cfg);
      r.countA=av?(Array.isArray(av)?av.length:Object.keys(av).length):0;
      r.countB=bv?(Array.isArray(bv)?bv.length:Object.keys(bv).length):0;
      return {cfg:cfg,res:r};
    });
  })).then(function(cards){
    diffCards=cards;
    renderDiffCards(va,vb);
  }).catch(function(err){
    body.innerHTML='<div class="empty"><div class="big">对比失败</div><div class="err">'+esc(err.message)+'</div></div>';
  });
}
function diffTotal(res){ return res.added.length+res.deleted.length+res.modified.length; }

/* ---- 渲染：汇总 + 模块筛选 chips + 变更卡片墙 ---- */
function renderDiffCards(va,vb){
  const body=$('diffBody'), sumEl=$('diffSummary');
  const cards=diffCards||[];
  /* 没有「全部」这一档：首次进入直接落在第一个有变更的模块上，少一次点击。
     搜索时 diffSel 临时置 0 跨模块找，清空后回到原来的模块。 */
  if(diffSel===0&&!diffQuery){
    const first=cards.findIndex(function(x){ return diffTotal(x.res)>0; });
    if(first>=0) diffSel=first+1;
  }
  /* 模块 chips：带变更数量，切换不重新请求 */
  $('diffTbar').innerHTML=DIFF_FILES.map(function(f,i){
      const c=cards[i]?diffTotal(cards[i].res):0;
      return '<div class="tchip'+(diffSel===i+1?' on':'')+(c?'':' zero')+'" data-i="'+(i+1)+'">'+esc(f.title)+(c?'<span class="cnt">'+c+'</span>':'')+'</div>';

  const tAdd=view.reduce((s,x)=>s+x.res.added.length,0);
  const tDel=view.reduce((s,x)=>s+x.res.deleted.length,0);
  const tMod=view.reduce((s,x)=>s+x.res.modified.length,0);

      '<div class="dsum-ver"><span class="lab">旧版本</span><b>'+tA.toLocaleString()+'</b><span class="sub">'+esc(verTime(va).slice(0,10))+'</span>'+
        '<span class="arw">→</span>'+
        '<span class="lab">新版本</span><b>'+tB.toLocaleString()+'</b><span class="sub">'+esc(verTime(vb).slice(0,10))+'</span></div>'+
      '<div class="dsum-total">共 <b>'+tAll+'</b> 处变更</div>'+
      '<div class="dsum-stats">'+
        '<button class="dstat add'+(diffFilter==='add'?' on':'')+(tAdd?'':' zero')+'" data-f="add"><b>'+(tAdd?'+'+tAdd:'0')+'</b><span>新增</span></button>'+
        '<button class="dstat del'+(diffFilter==='del'?' on':'')+(tDel?'':' zero')+'" data-f="del"><b>'+(tDel?'−'+tDel:'0')+'</b><span>删除</span></button>'+
        '<button class="dstat mod'+(diffFilter==='mod'?' on':'')+(tMod?'':' zero')+'" data-f="mod"><b>'+tMod+'</b><span>修改</span></button>'+

function modShell(x){

/* 模块内卡片顺序固定：新增 → 删除 → 修改。

function modBody(x){
  const res=x.res, ci=diffCards.indexOf(x);

  if(!diffFilter||diffFilter==='del') out+=res.deleted.map(function(it){ return cardAddDel('del',it); }).join('');

/* 新增 / 删除：数据里只有 name + key，没有可展开的字段明细，故不做展开 */
function cardAddDel(kind,it){

/* 修改：卡片可反复点开。正面先给 2 条「旧 → 新」预览，展开后是字段卡网格 */

function prevRow(r){

/* 展开内容：懒渲染，按分类分块，每块一张「字段卡」网格 —— 一张卡一个字段，上旧下新 */
function renderCardBody(card){

  if(cats.length){
    html=cats.map(function(c){
      return '<div class="dfgrp"><div class="dfgrp-t">'+esc(CAT_NAMES[c.cat]||c.cat)+'<i>'+c.count+' 处</i></div>'+
        '<div class="dfgrid">'+pushDeltaRows(c.delta,'',[]).map(fieldCard).join('')+'</div></div>';
    }).join('');
  } else {
    html='<div class="dfgrp"><div class="dfgrid">'+pushDeltaRows(it.delta,'',[]).map(fieldCard).join('')+'</div></div>';
  }
  card.querySelector('.dcard-bd').innerHTML=html;
  card.dataset.rendered='1';
}
function fieldCard(r){
  const hasOld=r.o!==null&&r.o!==undefined, hasNew=r.n!==null&&r.n!==undefined;
  let rows;
  if(hasOld&&hasNew){
    rows='<div class="row old"><span class="lab">旧</span><span class="dtxt">'+esc(trunc(fval(r.o),200))+'</span></div>'+
         '<div class="row new"><span class="lab">新</span><span class="dtxt">'+esc(trunc(fval(r.n),200))+'</span></div>';
  } else if(hasNew){
    rows='<div class="row only"><span class="lab">新</span><span class="dtxt">'+esc(trunc(fval(r.n),200))+'</span></div>';
  } else {
    rows='<div class="row old"><span class="lab">旧</span><span class="dtxt">'+esc(trunc(fval(r.o),200))+'</span></div>'+
         '<div class="row"><span class="lab">新</span><span class="dtxt"><span class="dnil">—</span></span></div>';
  }
  return '<div class="dfcard"><span class="dk">'+esc(r.k||'值')+'</span>'+rows+'</div>';
}

/* ============================================================
   版本切换
   ============================================================ */
function setVer(v){
  if(!VERSIONS.some(x=>x.id===v) || v===CUR_VER) return;
  CUR_VER=v;
  try{ localStorage.setItem('va_ver',v); }catch(e){}
  renderVer();
  /* 清空旧版本缓存索引，重新按需加载 */
  CAR_INDEX=[]; CAR_FULL=Object.create(null); TRACKS=[]; CHIPS=[];
  SEASON_START=null;
  route();
}

/* ============================================================
   移动端抽屉
   ============================================================ */
const navToggle=$('navToggle'), navMask=$('navMask');
function setNav(open){ document.body.classList.toggle('nav-open',open); }
navToggle.onclick=function(){ setNav(!document.body.classList.contains('nav-open')); };
navMask.onclick=function(){ setNav(false); };
/* 抽屉打开时，点侧栏与汉堡按钮以外的任何地方都关闭 ——
   只靠遮罩是不够的：侧栏压在遮罩上方，点在它旁边容易没反应。 */
document.addEventListener('click',function(e){
  if(!document.body.classList.contains('nav-open')) return;
  if(e.target.closest('.sidebar')||e.target.closest('#navToggle')) return;
  setNav(false);
},true);
/* 切换路由后自动收起抽屉，移动端点导航不会卡在打开状态 */
addEventListener('hashchange',function(){ setNav(false); });
addEventListener('keydown',function(e){ if(e.key==='Escape') setNav(false); });

/* 键盘可达：所有可点卡片都能 Tab 聚焦 + 回车/空格触发 */
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'&&e.key!==' '&&e.key!=='Spacebar') return;
  const el=document.activeElement;
  if(!el||el.tagName==='A'||el.tagName==='BUTTON'||el.tagName==='INPUT') return;
  if(el.classList&&el.classList.contains('tap')){ e.preventDefault(); el.click(); }
});

/* ============================================================
   启动
   ============================================================ */
async function boot(){
  try{
    const v=await fetch('ace/versions.json').then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
    VERSIONS=v;
  }catch(e){
    VERSIONS=[];
  }
  const def=(function(){
    try{ const s=localStorage.getItem('va_ver'); if(s&&VERSIONS.some(x=>x.id===s)) return s; }catch(e){}
    return VERSIONS.length?VERSIONS[VERSIONS.length-1].id:'';
  })();
  CUR_VER=def;
  if(!VERSIONS.length){
    $('main').innerHTML='<div class="empty"><div class="big">版本清单载入失败</div><div>请通过 HTTP 访问，且 <code>ace/versions.json</code> 可访问。</div></div>';
    return;
  }
  renderVer();
  buildNav();
  route();
}
boot();
})();
