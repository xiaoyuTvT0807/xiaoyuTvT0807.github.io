<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="XnBteNsP3mUweHBV8snqvL">
<head data-page-node-id="g811J4FFiOiN31c98Qeus9">
<meta charset="UTF-8" data-page-node-id="SPgjdzIJZPEyLgFcf7UHd2">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="oZEu1vTb16dW0jPA4J6rMX">
<title>车辆库</title>
<style>
/* ============================================================
   设计原则（参考 2026 主流优秀站点）
   · 玻璃只用于「侧栏 / 顶栏 / 浮层」这 1–2 层，内容区一律实色白卡
   · 单一品牌色（紫），中性冷灰阶建立层级；不再使用第二强调色
   · Bento 式模块化卡片：信息密度高但不拥挤
   · 微交互克制：hover 上浮、图片微放、下拉弹出、内容淡入
   ============================================================ */
:root{
  --bg:#f3f4f7;
  --surface:#fff;
  --surface-2:rgba(244,245,248,.62);
  --ink:#23272f;
  --ink-2:#5b626e;
  --muted:#9aa1ad;
  --line:rgba(35,39,47,0.08);
  --line-2:rgba(35,39,47,0.13);
  --accent:#6d5efc;
  --accent-ink:#5a45f5;
  --accent-soft:rgba(109,94,252,0.10);
  --radius:16px;
  --radius-sm:10px;
  --sh-1:0 1px 2px rgba(35,39,47,.04), 0 1px 3px rgba(35,39,47,.05);
  --sh-2:0 10px 28px rgba(35,39,47,.10), 0 2px 6px rgba(35,39,47,.05);
  --sh-3:0 18px 44px rgba(35,39,47,.14);
  --side-w:248px;
  --font-display:'PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  --font-body:'PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);color:var(--ink);
  background:var(--bg);           /* 干净浅灰底：内容区实色卡，不用照片背景 */
  display:flex;height:100vh;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(109,94,252,.16);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- 侧栏：唯一的玻璃层 ---------- */
.sidebar{
  width:var(--side-w);flex:0 0 var(--side-w);
  background:rgba(255,255,255,0.5);
  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 14px;gap:16px;overflow-y:auto;
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(35,39,47,.15);border-radius:3px}

/* 树形分支导航（Uiverse branched-menu，重制配色） */
.branched-menu{
  --bm-ink:var(--ink); --bm-accent:var(--accent-ink); --bm-line:var(--line-2);
  --bm-font:14px; --bm-row:38px; --bm-indent:38px; --bm-line-w:1.5;
  --bm-draw:400ms; --bm-fold:300ms; --bm-ease-out:cubic-bezier(0.23,1,0.32,1);
  --bm-muted:var(--muted);
  position:relative;display:flex;flex-direction:column;width:100%;
  padding-left:14px;color:var(--bm-ink);font-family:inherit;font-size:var(--bm-font);line-height:1.2;
}
.branched-menu::before{
  content:"";position:absolute;top:8px;bottom:0;left:0;width:2px;border-radius:1px;
  background:linear-gradient(to bottom, var(--bm-line) 0%, var(--bm-line) 55%, transparent 100%);
}
.sec-toggle,.item-radio{display:none}
.branched-menu__section{display:flex;flex-direction:column;position:relative}
.branched-menu__marker{
  position:absolute;top:10px;left:-14px;z-index:1;width:2px;height:16px;border-radius:1px;
  background:var(--bm-accent);opacity:0;transition:opacity 150ms ease;
}
.branched-menu__section:has(.sec-toggle:checked):has(.item-radio:checked) > .branched-menu__marker{opacity:1}
.branched-menu__head{
  display:block;margin:0;padding:9px 0;border:0;background:none;color:var(--bm-muted);
  font:inherit;font-size:calc(var(--bm-font) + 1px);font-weight:600;text-align:left;cursor:pointer;
  outline:none;transition:color 200ms ease;
}
.sec-toggle:checked ~ .branched-menu__head{color:var(--bm-ink)}
@media (hover:hover) and (pointer:fine){.branched-menu__head:hover{color:var(--bm-ink)}}
.branched-menu__body{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--bm-fold) var(--bm-ease-out)}
.sec-toggle:checked ~ .branched-menu__body{grid-template-rows:1fr}
.branched-menu__fold{min-height:0;overflow:hidden}
.branched-menu__tree{position:relative;padding:6px 0}
.branched-menu__lines{position:absolute;top:0;left:0;overflow:visible;opacity:0;pointer-events:none;transition:opacity 200ms ease}
.sec-toggle:checked ~ .branched-menu__body .branched-menu__lines{opacity:1;transition:opacity 250ms ease 100ms}
.branched-menu__base,.branched-menu__reach{fill:none;stroke-width:var(--bm-line-w);stroke-linecap:round;stroke-linejoin:round}
.branched-menu__base{stroke:var(--bm-line)}
.branched-menu__reach{stroke:var(--bm-accent);transition:stroke-dashoffset var(--bm-draw) var(--bm-ease-out)}
.branched-menu__item{
  display:flex;align-items:center;gap:9px;width:100%;height:var(--bm-row);margin:0;
  padding:0 8px 0 var(--bm-indent);border:0;background:none;color:var(--bm-muted);
  font:inherit;text-align:left;cursor:pointer;outline:none;border-radius:8px;
  transition:color 180ms ease, background 180ms ease;
}
@media (hover:hover) and (pointer:fine){.branched-menu__item:hover{background:rgba(35,39,47,.04);color:var(--bm-ink)}}
.item-radio:checked + .branched-menu__item{color:var(--bm-accent);font-weight:600;background:var(--accent-soft)}
.branched-menu__icon{display:inline-flex;flex:none;color:inherit}
.branched-menu__label{white-space:nowrap}
.branched-menu__soon{margin-left:auto;font-size:10px;font-weight:500;color:var(--muted);
  background:var(--surface-2);padding:2px 7px;border-radius:999px;border:1px solid var(--line)}
.side-foot{margin-top:auto;font-size:11px;color:var(--muted);text-align:center;padding-top:10px;border-top:1px solid var(--line)}

/* ---------- 主区 ---------- */
.main{flex:1;overflow-y:auto;padding:0 26px 40px}
.main::-webkit-scrollbar{width:9px}
.main::-webkit-scrollbar-thumb{background:rgba(35,39,47,.16);border-radius:5px}

/* 顶栏：第二层玻璃，滚动吸顶（负边距让玻璃条全宽铺满主区） */
.toolbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:10px;flex-wrap:nowrap;
  padding:16px 26px 14px;margin:0 -26px 14px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--line);
}
.toolbar h2{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.toolbar .count{font-family:var(--font-body);font-size:11.5px;font-weight:500;color:var(--muted);background:#f4f5f8;padding:2px 8px;border-radius:999px}
.selects{display:flex;gap:7px;flex-wrap:wrap;align-items:center;min-width:0}
.selects::-webkit-scrollbar{height:0}

/* 下拉选择：统一白底灰边，激活才用紫色 */
.sel{position:relative;min-width:120px;flex:0 0 auto}
.sel-btn{
  display:flex;align-items:center;gap:7px;width:100%;justify-content:flex-start;
  padding:7px 11px;border-radius:var(--radius-sm);font-size:12.5px;cursor:pointer;user-select:none;
  background:#fff;border:1px solid var(--line-2);color:var(--ink-2);
  box-shadow:var(--sh-1);transition:.15s;white-space:nowrap;
}
.sel-btn>span{white-space:nowrap}
.sel-btn:hover{border-color:var(--accent);color:var(--ink)}
.sel-btn .ic{
  width:18px;height:18px;flex:0 0 18px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:6px;background:rgba(35,39,47,.06);color:var(--ink-2);
  font-size:10px;font-weight:700;font-family:var(--font-display);line-height:1;
  transition:.15s;
}
.sel-btn:hover .ic{background:var(--accent-soft);color:var(--accent-ink)}
.sel-btn .arrow{font-size:8px;color:var(--muted);margin-left:auto;transition:transform .2s ease;line-height:1}
.sel.open .sel-btn{border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 3px var(--accent-soft)}
.sel.open .sel-btn .ic{background:var(--accent-soft);color:var(--accent-ink)}
.sel.open .sel-btn .arrow{transform:rotate(180deg);color:var(--accent-ink)}
/* 排序按钮与筛选统一风格，当前激活仅紫色文字/边框 */
.sel[data-kind="sort"] .sel-btn{background:#fff;border-color:var(--line-2);color:var(--ink-2);font-weight:500}
.sel[data-kind="sort"] .sel-btn:hover{border-color:var(--accent);color:var(--ink)}
.sel[data-kind="sort"].open .sel-btn{border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 3px var(--accent-soft)}
.sel[data-kind="sort"] .sel-btn .ic{background:rgba(35,39,47,.06);color:var(--ink-2)}
.sel[data-kind="sort"].open .sel-btn .ic,
.sel[data-kind="sort"] .sel-btn:hover .ic{background:var(--accent-soft);color:var(--accent-ink)}
button.sel-btn{border:0;font:inherit;background:none;appearance:none;-webkit-appearance:none}
button.sel-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sort-toggle .arrow{font-size:10px;opacity:.7}
.sel-list{
  position:absolute;top:calc(100% + 6px);left:0;min-width:100%;z-index:40;display:none;flex-direction:column;gap:2px;
  padding:6px;border-radius:var(--radius-sm);background:rgba(255,255,255,.9);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid var(--line);box-shadow:var(--sh-3);
}
.sel.open .sel-list{display:flex;animation:dropIn .16s ease}
@keyframes dropIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.sel-list .opt{padding:7px 9px;border-radius:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.sel-list .opt:hover{background:var(--accent-soft);color:var(--accent-ink)}
.sel-list .opt.on{color:var(--accent-ink);font-weight:600}
.sel-list .opt.on::after{content:"✓";margin-left:auto;font-size:11px}
.sel-list .opt .oi{width:18px;height:18px;flex:0 0 18px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:6px;background:rgba(35,39,47,.06);font-size:10px;font-weight:700;color:var(--ink-2)}
.sel-list .opt:hover .oi{background:rgba(109,94,252,.18);color:var(--accent-ink)}
.sel-list .opt.on .oi{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(109,94,252,.38)}
.sel-list .opt .hint{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:400}
.sel-list .opt.on .hint{display:none}
/* 版本下拉：保留日期 */
.sel[data-kind="ver"] .opt.on .hint{display:inline}
.sel-btn .vtime{font-style:normal;font-size:10.5px;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}

/* 搜索 */
.search{margin-left:auto;position:relative;display:flex;align-items:center;flex:1 1 130px;min-width:104px;max-width:280px}
.search input{
  width:100%;min-width:0;padding:8px 12px 8px 34px;border-radius:var(--radius-sm);
  background:#fff;border:1px solid var(--line-2);color:var(--ink);
  font-size:12.5px;outline:none;transition:.15s;box-shadow:var(--sh-1);
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search .search-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted);opacity:.55;pointer-events:none}

/* 被外壳 iframe 嵌入时：版本下拉由外壳侧栏提供，页内不再重复 */
html.embedded .sel[data-kind="ver"]{display:none}

/* ---------- 卡片（参考稿：大图 + 品级徽章 + 名称/厂商 + 圆角标签，无被动） ---------- */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:18px}
.grid-cards:has(.empty){display:block}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:56px 20px;color:var(--ink-2);text-align:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh-1)}
.empty-ic{width:46px;height:46px;color:var(--accent-ink);opacity:.5}
.empty-t{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--ink-2)}
.empty-s{font-size:12.5px}
.vcard{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;box-shadow:var(--sh-1);--tier:#c9d2e0;will-change:transform;
  transition:transform .22s cubic-bezier(.23,1,.32,1), box-shadow .22s, border-color .22s;
}
.vcard:hover{transform:translateY(-5px);box-shadow:var(--sh-3);border-color:color-mix(in srgb,var(--tier) 45%,transparent)}
.vcard:active{transform:translateY(-2px) scale(.992)}
.vcard .thumb{
  aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#f0f1f4,#f6f7f9 70%);border-bottom:1px solid rgba(35,39,47,.05);
}
.vcard .thumb img{width:100%;height:100%;object-fit:contain;opacity:0;transition:transform .35s cubic-bezier(.23,1,.32,1), opacity .35s ease}
.vcard .thumb.ok img{opacity:1}
.vcard:hover .thumb img{transform:scale(1.07)}
.vcard .thumb .ph{font-family:var(--font-display);font-size:34px;font-weight:700;
  background:linear-gradient(135deg,#b9c0cc,#8a93a3);-webkit-background-clip:text;background-clip:text;color:transparent}
.vcard .thumb .ph-tip{position:absolute;bottom:7px;right:8px;font-size:9px;color:var(--muted);
  background:rgba(255,255,255,.85);padding:2px 7px;border-radius:999px;opacity:0;transition:opacity .2s}
.vcard:hover .thumb .ph-tip{opacity:1}
.vcard .grade{display:none}
.vcard .body{padding:10px 12px 12px}
.vcard .nm{font-family:var(--font-display);font-size:14.5px;font-weight:700;letter-spacing:.2px;
  display:flex;align-items:baseline;gap:7px;min-width:0}
.vcard .nm .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcard .nm .mk{display:none}
.vcard .tags{display:none}

.tag{font-size:11.5px;padding:4px 12px;border-radius:999px;background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.tag.f{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.tag.r{background:rgba(35,39,47,.05);color:var(--ink-2);border-color:var(--line)}

/* ---------- 详情 ---------- */
.back{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;color:var(--ink-2);
  margin-bottom:12px;padding:6px 12px;border-radius:var(--radius-sm);background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--sh-1);transition:.15s}
.back:hover{color:var(--ink);border-color:var(--accent)}
.back:hover .ar{transform:translateX(-3px)}
.back .ar{display:inline-block;transition:transform .18s ease}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh-1)}
.detail-wrap{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:14px;align-items:start}
.col-info{display:flex;flex-direction:column;gap:12px;min-width:0}
.col-info .card{margin-bottom:0}
.col-media{position:sticky;top:74px;display:flex;flex-direction:column;gap:12px}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh-1);padding:12px}
.hero .pic{
  aspect-ratio:16/10;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(135deg,#f0f1f4,#e9ebf0);display:flex;align-items:center;justify-content:center;position:relative;
}
.hero .pic img{width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .35s ease}
.hero .pic.ok img{opacity:1}
.hero .pic .ph{font-family:var(--font-display);font-size:42px;font-weight:700;
  background:linear-gradient(135deg,#b9c0cc,#8a93a3);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .pic .ph-tip{position:absolute;bottom:8px;right:10px;font-size:9.5px;color:var(--muted);background:rgba(255,255,255,.85);padding:2px 7px;border-radius:5px}
/* 图片加载成功后隐藏占位字与提示（透明 PNG 会透出下层） */
.thumb.ok .ph,.thumb.ok .ph-tip,.pic.ok .ph,.pic.ok .ph-tip{display:none}
.hero-cap{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font-size:11.5px;color:var(--muted)}
.hero-skins{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh-1);padding:12px}
.hero-skins .mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:9px}
.mini{text-align:center;cursor:pointer}
.mini .box{width:100%;aspect-ratio:16/10;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line);position:relative;
  background:linear-gradient(135deg,#f0f1f4,#e9ebf0);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:var(--accent-ink);transition:.16s}
.mini .box img{width:100%;height:100%;object-fit:contain}
.mini:hover .box{border-color:var(--accent);transform:translateY(-2px)}
.mini.on .box{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.mini .sn{font-size:10.5px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.h-title{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:.2px;
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.h-title .mk{font-family:var(--font-body);font-size:13px;font-weight:400;color:var(--muted)}
.h-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.sec-title{font-family:var(--font-display);font-size:13.5px;font-weight:600;margin:0 0 10px;
  display:flex;align-items:center;gap:7px;color:var(--ink)}
.sec-title::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.grid.core{grid-template-columns:repeat(5,minmax(0,1fr))}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px}
.stat .k{font-size:10.5px;color:var(--muted)}
.stat .v{font-family:var(--font-display);font-size:15.5px;font-weight:600;margin-top:2px}
.stat .v small{font-size:11px;font-weight:500;color:var(--muted)}
.desc{font-size:13px;line-height:1.65;color:var(--ink-2)}
.desc.tech{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:10px 12px;font-size:12px}
.node{border-left:3px solid var(--accent-ink);background:var(--accent-soft);padding:8px 12px;
  border-radius:0 8px 8px 0;margin-bottom:6px;font-size:12.5px}
.node .nt{font-weight:600;color:var(--ink);margin-bottom:3px}
.node .nt .dup{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;background:#eceef3;
  color:var(--muted);font-size:10px;font-weight:600;vertical-align:1px;cursor:help}
.node .nv{color:var(--ink-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
.kv .k{color:var(--muted);font-size:12px;white-space:normal;word-break:break-all;max-width:16em}
.kv .v{word-break:break-all}
@media(max-width:900px){
  .kv{grid-template-columns:1fr;gap:2px 0}
  .kv .k{max-width:none;font-weight:600;margin-top:4px}
}
.chips-shapes{display:flex;gap:8px;flex-wrap:wrap}
.shape{width:60px;padding:7px 4px 5px;border-radius:var(--radius-sm);background:var(--surface-2);
  border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px}
.shape svg{width:26px;height:26px;stroke:var(--accent-ink);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.shape .lb{font-size:10.5px;color:var(--muted)}

<script>
if(window.parent!==window) document.documentElement.classList.add("embedded");

/* ---------- 版本管理 ---------- */
/* 数据由浏览器原生 fetch 合并文件：ace/<版本>/vehicles.json
   结构 {"<ID>":{"车辆档案":{…}}, …}，无需任何构建步骤 */
const VERSIONS = [
  {id:'29836883', label:'29836883', data:'../ace/29836883/vehicles.json'},
  {id:'29842023', label:'29842023', data:'../ace/29842023/vehicles.json'}
];
const DEFAULT_VER = '29842023';
/* 版本号 → 时间：版本号是「Unix 时间戳的分钟数」 */
function verTime(id){
  const n=Number(id);
  if(!isFinite(n)||n<=0) return '';
  const d=new Date(n*60000), p=v=>String(v).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function getVerParam(){
  const p=new URLSearchParams(location.search);
  let v=p.get('v');
  if(!v){ const h=new URLSearchParams(location.hash.replace(/^#/,'%23')); v=h.get('v'); }
  if(!v){ try{ v=localStorage.getItem('va_ver'); }catch(e){} }
  return VERSIONS.some(x=>x.id===v) ? v : DEFAULT_VER;
}
function verCfg(v){ return VERSIONS.find(x=>x.id===v) || VERSIONS[0]; }
const resolveDataUrl = v => verCfg(v).data || 'vehicles.json';
let CUR_VER = getVerParam();

// 图片已并入 acewiki/images, 随仓库部署, 不再走 jsDelivr。
const ICON_BASE = 'images/';    // 图片已并入 acewiki/images, 原皮图目录

// 合并文件里的整车档案缓存：String(ID) → 车辆档案对象
let CAR_FULL = Object.create(null);
/* 原生读取该版本的合并 JSON，展开成列表索引 INDEX（含详情渲染所需的轻字段） */
async function loadIndex(v){
  const r = await fetch(resolveDataUrl(v), {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const data = await r.json();
  CAR_FULL = Object.create(null);
  const list = [];
  Object.keys(data).forEach(function(k){
    const rec = data[k] && data[k]['车辆档案'] ? data[k]['车辆档案'] : data[k];
    if(!rec || typeof rec!=='object') return;
    const b=rec['基础']||{}, t=rec['车辆缩略图']||{};
    const id = b['数据ID'];
    CAR_FULL[String(id)] = rec;
    list.push({
      id:id, name:b['名称']||('ID '+id), maker:b['厂商'],
      camp:b['阵营'], role:b['定位'], track:b['赛道专精'], drive:b['驱动方式'],
      grade:b['品级'], skill:b['技能简述'],
      thumb:t['图标b']||t['图标m']||t['图标s']||'',
      passive:(rec['被动']||[]).map(function(x){return {n:x['名称'],id:x['技能ID'],e:x['效果']};}),
      file:String(id)
    });
  });
  list.sort(function(a,b){return (a.id||0)-(b.id||0);});
  window.INDEX = list;
}

// INDEX（原生展开的轻索引）→ 列表用的 CARS，形状兼容详情渲染

function buildCARS(){

          赛道专精:x.track,驱动方式:x.drive,品级:x.grade,技能简述:x.skill},
    车辆缩略图:{图标b:x.thumb},
    被动:(x.passive||[]).map(function(p){return {名称:p.n,技能ID:p.id,效果:p.e};}),
    _file:x.file
  }));
}

let keyword='', filterCamp='全部', filterRole='全部', sortBy='ID 小→大';

  cmp:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 7h4l-2 3 2 3H5"/><path d="M19 7h-4l2 3-2 3h4"/></svg>',
  data:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'

function branchSVG(n){
  const baseY=14+(n-1)*38;
  let s='<path class="branched-menu__base" d="M 14 0 V '+baseY+'"></path>';
  for(let i=0;i<n;i++){
    const b=14+i*38, e=b+10, len=(b+Math.PI*10/2+8).toFixed(2);
    s+='<path class="branched-menu__base" d="M 14 '+b+' A 10 10 0 0 0 24 '+e+' H 32"></path>';
    s+='<path class="branched-menu__reach" d="M 14 0 V '+b+' A 10 10 0 0 0 24 '+e+' H 32" style="stroke-dasharray:'+len+';stroke-dashoffset:'+len+';"></path>';
  }
  return '<svg class="branched-menu__lines" width="40" height="'+(n*38+12)+'" aria-hidden="true">'+s+'</svg>';
}
function buildNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=SECTIONS.map(function(sec,si){

      '<label for="'+it.id+'" class="branched-menu__item" data-module="'+it.module+'">'+

      branchSVG(sec.items.length)+items+'</div></div></div></div>';

  const def=nav.querySelector('.item-radio:checked');
  if(def){
    const tree=def.closest('.branched-menu__section').querySelector('.branched-menu__tree');
    const r=tree.querySelectorAll('.branched-menu__reach'); if(r[0]) r[0].style.strokeDashoffset='0';

  nav.querySelectorAll('.branched-menu__item').forEach(function(lbl){

const mainEl=document.getElementById('main');
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
/* 技能文本里的 #rrggbb 颜色码 → 真彩色；近白色（#ffffff 等）在游戏文本里表示「恢复默认颜色」，
   白字白底会看不见，故视为默认色；亮度过高的颜色压暗到可读范围 */
const richText=(function(){
  const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const lin=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)};
  const h2=v=>v.toString(16).padStart(2,'0');
  return function(s){
    if(s===undefined||s===null) return '';
    const parts=String(s).split(/(#[0-9a-fA-F]{6})/);
    let cur=null,out='';
    for(const p of parts){
      if(!p) continue;
      if(/^#[0-9a-fA-F]{6}$/.test(p)){ cur=p.toLowerCase(); continue; }
      if(!cur){ out+=esc(p); continue; }
      let [r,g,b]=rgb(cur);
      if(Math.min(r,g,b)>=232){ out+=esc(p); continue; }
      let L=0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b),i=0;
      while(L>0.72&&i<24){ r=Math.round(r*.88); g=Math.round(g*.88); b=Math.round(b*.88);
        L=0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b); i++; }
      out+='<span style="color:#'+h2(r)+h2(g)+h2(b)+'">'+esc(p)+'</span>';
    }
    return out;
  };
})();
const fmt=v=>(v===undefined||v===null)?'—':v;
// 缩略图统一转 WebP：图标s/m/b 都是同一张图的不同尺寸后缀，一律取 _m 的 WebP 版本
function iconUrl(c,size){const t=c.车辆缩略图||{};const n=t['图标'+(size||'s')];return n?ICON_BASE+n.replace(/_(?:s|b|m)\.png$/i,'_m.png'):'';}
// 稀有度：1普通 / 2稀有 / 3史诗 / 4传说
function tierOf(g){g=Number(g)||0;
  const m={1:['普通','#9aa6bd'],2:['稀有','#3b82f6'],3:['史诗','#a855f7'],4:['传说','#f5a623']};
  return {name:m[g]?m[g][0]:'未知',color:m[g]?m[g][1]:'#9aa6bd'};}
function pct(v){if(v===undefined||v===null||v==='')return null;const n=Number(v);if(isNaN(n))return null;return (Math.round(n/100*100)/100)+'%';}

/* ===== 芯片槽形状：手绘 SVG ===== */
function polyPoints(sides,r,cx,cy){
  r=r||8.5;cx=(cx===undefined?12:cx);cy=(cy===undefined?12:cy);
  const p=[];
  for(let i=0;i<sides;i++){const a=-Math.PI/2+i*2*Math.PI/sides;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}
  return p.join(' ');
}
function shapeSVG(name){
  const n=String(name||''), V='viewBox="0 0 24 24"';
  if(n.indexOf('圆')>=0)   return '<svg '+V+'><circle cx="12" cy="12" r="8.5"/></svg>';
  if(n.indexOf('三角')>=0) return '<svg '+V+'><polygon points="'+polyPoints(3,9)+'"/></svg>';
  if(n.indexOf('菱形')>=0) return '<svg '+V+'><polygon points="'+polyPoints(4,9)+'"/></svg>';
  if(/V/i.test(n))         return '<svg '+V+'><path d="M5 5 L12 19 L19 5"/></svg>';
  const m=n.match(/(\d+)/); const sides=m?Math.max(3,+m[1]):(n.indexOf('六')>=0?6:5);
  return '<svg '+V+'><polygon points="'+polyPoints(sides)+'"/></svg>';
}

/* ===== 骨架屏 ===== */
function renderSkeleton(){
  const line=(w,m)=>'<div class="skel skel-line" style="width:'+w+';'+(m?'margin-top:'+m+';':'')+'"></div>';
  mainEl.innerHTML='<div class="skel skel-back" style="margin-bottom:12px"></div>'+

      line('72%','14px')+line('54%','8px')+'</div>'+
    '<div class="card"><div class="skel skel-line" style="width:96px;margin-bottom:10px"></div>'+

    '<div class="card"><div class="skel skel-line" style="width:120px;margin-bottom:10px"></div>'+
      line('88%','0')+line('76%','8px')+line('60%','8px')+'</div>'+
  '</div><div class="col-media">'+
    '<div class="hero"><div class="skel skel-pic"></div>'+

/* ===== 打开详情：按需加载单车 JSON =====
   三档加速：
   1) 已取过的车进 CAR_CACHE，再点直接渲染，连骨架屏都不出（返回/前进秒开）；
   2) 请求进行中的写进 CAR_PREFETCH，多张卡片同时悬停不会重复 fetch；
   3) 指针悬停或按下时提前开始取，点下去往往已经就绪。            */
const CAR_CACHE = Object.create(null);
const CAR_PREFETCH = Object.create(null);

/* 详情：直接取已原生加载的合并文件里的整车档案（key = 车辆 ID 字符串） */
function loadCar(key){
  if(CAR_CACHE[key]) return Promise.resolve(CAR_CACHE[key]);
  if(CAR_PREFETCH[key]) return CAR_PREFETCH[key];
  const p=Promise.resolve().then(()=>{
    const d=CAR_FULL[String(key)];
    if(!d) throw new Error('未找到车辆：'+key);
    CAR_CACHE[key]=d;
    return d;
  });
  CAR_PREFETCH[key]=p;
  return p;
}
function prefetchCar(file){
  if(!file||CAR_CACHE[file]||CAR_PREFETCH[file])return;
  loadCar(file).then(function(){},function(){});
}

async function openDetail(item){
  const cached=CAR_CACHE[item._file];
  if(cached){ renderDetail(cached); window.scrollTo(0,0); return; }  // 命中缓存：零等待
  renderSkeleton();
  try{
    renderDetail(await loadCar(item._file));
    window.scrollTo(0,0);
  }catch(err){
    mainEl.innerHTML='<div class="soon-view"><div class="big"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r=".8" fill="currentColor" stroke="none"/></svg></div>'+
      '<div>加载失败：'+esc(item._file||'')+'</div>'+
      '<div style="font-size:12px">file:// 直接打开时浏览器禁止读取本地 JSON，请用本地服务器或线上地址访问</div></div>';
  }
}

/* ===== 路由：/10032 、 ?id=10032 、 #10032 ===== */
function routeId(){
  const seg=(location.pathname.replace(/\/+$/,'').split('/').pop()||'').trim();
  if(/^\d{2,}$/.test(seg) && seg!=='index.html') return seg;
  const q=new URLSearchParams(location.search).get('id'); if(q) return q;
  const h=(location.hash||'').replace(/^#\/?/,'').trim(); if(h) return h;
  return '';
}
function applyRoute(){
  const id=routeId();
  if(id){
    if(window.parent!==window&&window.parent.openCar){ window.parent.openCar(id, CUR_VER); return; }
    location.replace('car.html?id='+encodeURIComponent(id)+'&v='+encodeURIComponent(CUR_VER)); return;
  }
  detailIdx=-1; renderCards();
}
addEventListener('popstate',applyRoute);
addEventListener('hashchange',applyRoute);

function renderMain(){
  if(currentModule==='车辆'){
    if(detailIdx>=0) return openDetail(CARS[detailIdx]);
    return renderCards();
  }
  renderSoon(currentModule);
}
function renderSoon(name){

    '<div style="font-size:16px">「'+esc(name)+'」模块待开发</div>'+
    '<div style="font-size:13px">左侧导航已预留入口，上传数据后即可接入</div></div>';

/* ===== 列表 ===== */
function sortItems(items){
  const idOf=x=>Number(x.c.基础.数据ID)||0, arr=items.slice();
  if(sortBy==='ID 小→大') arr.sort((a,b)=>idOf(a)-idOf(b));
  else if(sortBy==='ID 大→小') arr.sort((a,b)=>idOf(b)-idOf(a));
  else if(sortBy==='品级 高→低') arr.sort((a,b)=>(Number(b.c.基础.品级)||0)-(Number(a.c.基础.品级)||0)||idOf(a)-idOf(b));
  else arr.sort((a,b)=>String(a.c.基础.名称||'').localeCompare(String(b.c.基础.名称||''),'zh'));
  return arr;
}
const shortIcon=v=>v==='全部'?'全':(String(v).replace(/（.*/,'').trim()[0]||'·');
function selHTML(label,arr,cur,kind,icons,hints){
  if(kind==='sort'){
    const bi=icons[cur]||'⇅', next=arr[(arr.indexOf(cur)+1)%arr.length];
    return '<div class="sel" data-kind="'+kind+'">'+
      '<button type="button" class="sel-btn sort-toggle" data-next="'+esc(next)+'" title="当前：'+esc(cur)+'，点击切换为 '+esc(next)+'">'+
      '<span class="ic">'+esc(bi)+'</span><span>'+esc(label+'：'+cur)+'</span><span class="arrow">⇅</span></button></div>';
  }
  const bi=shortIcon(cur);
  return '<div class="sel" data-kind="'+kind+'">'+
    '<div class="sel-btn"><span class="ic">'+esc(bi)+'</span><span>'+esc(cur==='全部'?label:label+'：'+cur)+'</span><span class="arrow">▼</span></div>'+
    '<div class="sel-list">'+arr.map(function(v){
      return '<div class="opt'+(v===cur?' on':'')+'" data-v="'+esc(v)+'">'+
      '<span class="oi">'+esc(shortIcon(v))+'</span><span>'+esc(v)+'</span>'+
      (hints&&hints[v]?'<span class="hint">'+esc(hints[v])+'</span>':'')+'</div>';
    }).join('')+'</div></div>';
}
/* 版本下拉（与阵营/定位同款：白底灰边 + 向下箭头） */
const VER_ICON='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0l-7.2-7.2A2 2 0 0 1 2.9 12V4a2 2 0 0 1 2-2h8a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>';
function selVerHTML(cur){
  const t=verTime(cur);
  return '<div class="sel" data-kind="ver">'+
    '<div class="sel-btn"><span class="ic">'+VER_ICON+'</span><span>版本：'+esc(cur)+(t?'<i class="vtime">'+esc(t.slice(0,10))+'</i>':'')+'</span><span class="arrow">▼</span></div>'+
    '<div class="sel-list">'+VERSIONS.map(function(x){
      const xt=verTime(x.id);
      return '<div class="opt'+(x.id===cur?' on':'')+'" data-v="'+esc(x.id)+'" title="'+esc(xt)+'">'+
        '<span>'+esc(x.label)+'</span>'+(xt?'<span class="hint">'+esc(xt.slice(0,10))+'</span>':'')+'</div>';
    }).join('')+'</div></div>';
}
/* 切换数据版本：iframe 内交给外壳重载；独立打开则本地重载索引 */
function changeVer(v){
  if(!VERSIONS.some(x=>x.id===v) || v===CUR_VER) return;
  CUR_VER=v;
  try{ localStorage.setItem('va_ver',v); }catch(e){}
  if(window.parent!==window && typeof window.parent.setVer==='function'){ window.parent.setVer(v); return; }
  loadIndex(CUR_VER).then(function(){ buildCARS(); buildFilters(); applyRoute(); });
}
function computeItems(){
  const kw=keyword.trim().toLowerCase();
  return sortItems(CARS.map((c,i)=>({c,i})).filter(function(o){
    const b=o.c.基础;
    if(filterCamp!=='全部'&&b.阵营!==filterCamp)return false;
    if(filterRole!=='全部'&&b.定位!==filterRole)return false;
    if(kw){const hay=(b.名称+' '+(b.厂商||'')).toLowerCase();if(!hay.includes(kw))return false;}
    return true;
  }));
}
function cardsHTML(items){
  return items.map(function(o,idx){
    const b=o.c.基础, tb=(o.c.车辆缩略图&&o.c.车辆缩略图.图标b)||''; const url=tb?ICON_BASE+tb.replace(/_(?:s|b|m)\.png$/i,'_m.png'):'';
    // 占位符垫底，图片绝对定位叠加；加载失败时移除 img 露出占位符（不往属性里塞 HTML）
    const ph='<div class="ph" style="background:linear-gradient(135deg,#b9c0cc,#8a93a3);-webkit-background-clip:text;background-clip:text">'+esc(b.名称[0]||'?')+'</div><div class="ph-tip">原皮待上传</div>';
    // 首屏前 12 张不懒加载且高优先级（WebP 单图约 30KB，不 lazy 也不会拖慢首屏）；
    // 其余保持 lazy + 低优先级，滚动到才取
    const eager = idx < 12;
    const img=(u)=>'<img src="'+u+'" decoding="async" '+
      (eager?'fetchpriority="high"':'loading="lazy" fetchpriority="low"')+
      ' style="position:absolute;inset:0" onload="this.parentNode.classList.add(\'ok\')" onerror="this.remove()">';
    const tier=tierOf(b.品级);
    // 图区底色按品级轻染（参考稿的淡紫底），无图车占位符居中大字
    // 注意末尾三个 </div>：tags / body / vcard 各一个，少一个会把后面的卡全部嵌进来
    return '<div class="vcard" data-i="'+o.i+'" style="--tier:'+tier.color+'">'+
      '<div class="thumb" style="background:linear-gradient(165deg,'+tier.color+'14,#f6f7f9 68%)">'+ph+(url?img(url):'')+'</div>'+
      '<div class="body"><div class="nm"><span class="t">'+esc(b.名称)+'</span></div></div></div>';
  }).join('');
}
function emptyHTML(){
  return '<div class="empty">'+
    '<svg class="empty-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/><path d="M8 11h6"/></svg>'+
    '<div class="empty-t">没有匹配的车辆</div>'+

  '</div>';
}
function bindCards(){
  mainEl.querySelectorAll('.vcard').forEach(function(el){
    el.onclick=function(){
      // 列表只负责列表：被外壳载入时交给外壳切到车辆页，独立打开则直接跳转
      const id=CARS[+el.dataset.i].基础.数据ID;
      if(id===undefined||id===null) return;
      if(window.parent!==window&&window.parent.openCar) window.parent.openCar(id, CUR_VER);
      else location.href='car.html?id='+encodeURIComponent(id)+'&v='+encodeURIComponent(CUR_VER);
    };
    // 提前开始取 JSON：hover 先预热，按下再补一次，点下去常常已经缓存
    el.onpointerenter=function(){prefetchCar(CARS[+el.dataset.i]&&CARS[+el.dataset.i]._file);};
    el.onpointerdown=function(){prefetchCar(CARS[+el.dataset.i]&&CARS[+el.dataset.i]._file);};
  });
}
function bindSelects(){
  mainEl.querySelectorAll('.sel').forEach(function(box){
    const kind=box.dataset.kind;
    const btn=box.querySelector('.sel-btn');
    if(kind==='sort'){
      btn.onclick=function(e){
        e.stopPropagation();
        sortBy=btn.dataset.next;
        try{ localStorage.setItem('va_sort',sortBy); }catch(err){}
        renderCards();
      };
      return;
    }
    btn.onclick=function(e){
      e.stopPropagation();
      const open=box.classList.contains('open');
      mainEl.querySelectorAll('.sel').forEach(function(b){b.classList.remove('open');});
      if(!open)box.classList.add('open');
    };
    box.querySelectorAll('.opt').forEach(function(o){
      o.onclick=function(e){
        e.stopPropagation();
        if(kind==='camp')filterCamp=o.dataset.v;
        else if(kind==='role')filterRole=o.dataset.v;
        else if(kind==='ver'){ changeVer(o.dataset.v); return; }
        renderCards();
      };
    });
  });
}
/* 每次渲染前都从 localStorage 同步一次排序，返回/重载后仍保持用户上次的选择 */
function syncSort(){ try{ const _s=localStorage.getItem('va_sort'); if(SORTS.indexOf(_s)>=0) sortBy=_s; }catch(e){} }
/* 完整渲染：工具栏 + 网格（切换模块 / 改筛选 / 改排序时调用） */

        '<div class="selects">'+selHTML('排序',SORTS,sortBy,'sort',SORT_ICON,SORT_HINT)+
          selHTML('阵营',camps,filterCamp,'camp')+selHTML('定位',roles,filterRole,'role')+selVerHTML(CUR_VER)+'</div>'+
      '<div class="search"><svg class="search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="search" placeholder="搜索车名 / 厂商…" value="'+esc(keyword)+'" autocomplete="off"></div>'+

      (c.芯片.扩展槽形状&&c.芯片.扩展槽形状.length
        ?'<div style="font-size:11.5px;color:var(--muted);margin:12px 0 8px">扩展槽形状</div><div class="chips-shapes">'+
          c.芯片.扩展槽形状.map(function(s){return '<div class="shape">'+shapeSVG(s)+'<div class="lb">'+esc(s)+'</div></div>';}).join('')+'</div>'
        :'')+'</div>';}

  if(c.故事){info+='<div class="card"><div class="sec-title">故事</div><p class="desc tech">'+esc(c.故事)+'</p></div>';}

  mainEl.innerHTML='<div class="back" id="back"><span class="ar">←</span> 返回车辆</div>'+
    '<div class="detail-wrap"><div class="col-info">'+info+'</div>'+mediaCol+'</div>';
  document.title=(b.名称?b.名称+' · ':'')+'车辆库';
  mainEl.classList.remove('fade-in'); void mainEl.offsetWidth; mainEl.classList.add('fade-in');

  document.getElementById('back').onclick=function(){
    detailIdx=-1;
    history.pushState({},'',(location.pathname.replace(/\/\d+$/,'/').replace(/\?.*$/,'')||'./'));
    renderCards(); window.scrollTo(0,0);
  };
  mainEl.querySelectorAll('.mini').forEach(function(el){
    el.onclick=function(){
      mainEl.querySelectorAll('.mini').forEach(function(m){m.classList.remove('on');});
      el.classList.add('on');
      const u=el.dataset.img||'', nm=el.dataset.name||'';
      const pic=document.getElementById('hero-pic');
      pic.innerHTML = phPic + picImg(u);
      document.getElementById('hero-name').textContent=nm;
    };
  });
}

function stat(k,v,unit,raw){
  if(v===undefined||v===null||v==='')return '';
  return '<div class="stat"'+((raw!==undefined&&raw!==null&&raw!=='')?' title="原始值 '+esc(raw)+'"':'')+'>'+
    '<div class="k">'+k+'</div><div class="v">'+v+(unit?'<small> '+unit+'</small>':'')+'</div></div>';
}
function kv(k,v){return '<div class="k">'+k+'</div><div class="v">'+esc(v)+'</div>';}
/* 节点去重：屏幕内容完全一样的节点（数据里只有内部 ID 不同，如 800951~800960）只保留一个 */
const normNodeVal=v=>(Array.isArray(v)?v.map(normNodeVal)
  :(v&&typeof v==='object'?Object.keys(v).sort().reduce(function(o,k){o[k]=normNodeVal(v[k]);return o;},{})
  :(typeof v==='string'?v.replace(/[（(]\s*\d+\s*[)）]/g,'').replace(/#?\d{5,}/g,'').trim():v)));
const NODE_SKIP={节点名:1,节点ID:1,判断节点ID:1,条件:1,分支:1,效果节点:1};
function nodeSig(n){
  const o={};
  Object.keys(n).sort().forEach(function(k){
    if(NODE_SKIP[k]||String(k).charAt(0)==='_')return;
    o[k]=normNodeVal(n[k]);
  });
  return JSON.stringify(o);
}
function dedupeNodes(list){
  if(!Array.isArray(list))return [];
  const seen={},out=[];
  list.forEach(function(n){
    if(!n)return;
    const s=nodeSig(n);
    if(seen[s]){ seen[s]._dup++; return; }      // 与前面节点完全一样 → 隐藏
    const c=Object.assign({},n); c._dup=1; seen[s]=c; out.push(c);
  });
  return out;
}
function renderNode(n){
  if(!n)return '';
  const title=n.节点名||n.条件||'节点', id=(n.节点ID!==undefined?n.节点ID:n.判断节点ID);
  const pairs=[];
  for(const k in n){
    if(String(k).charAt(0)==='_')continue;
    if(['节点名','节点ID','判断节点ID','条件','分支','效果节点'].indexOf(k)>=0)continue;
    const val=n[k];
    if(k==='描述'&&(!val||/\{.*\}/.test(val)))continue;
    if(Array.isArray(val))continue;
    pairs.push([k,val]);
  }
  let extra=pairs.length?'<div class="kv">'+pairs.map(function(p){return kv(p[0],p[1]);}).join('')+'</div>':'';
  let inner=extra;
  if(n.分支) inner+=n.分支.map(function(b){
    const spairs=[];
    for(const k in b){
      if(k==='节点名')continue;
      const v=b[k];
      if(k==='描述'&&/\{.*\}/.test(v||''))continue;
      if(k==='子节点'){spairs.push(['子节点','#'+v]);continue;}
      spairs.push([k,v]);
    }
    const shtml=spairs.length?'<div class="kv">'+spairs.map(function(p){return kv(p[0],p[1]);}).join('')+'</div>':'';
    return '<div class="node" style="margin-top:6px;border-left-color:var(--muted)"><div class="nt">'+esc(b.节点名||'分支')+'</div>'+shtml+'</div>';
  }).join('');
  if(n.效果节点) inner+='<div style="margin-top:6px">'+(Array.isArray(n.效果节点)?dedupeNodes(n.效果节点):dedupeNodes([n.效果节点])).map(renderNode).join('')+'</div>';
  const dup=n._dup>1?'<small class="dup" title="另有 '+(n._dup-1)+' 个内容完全相同的节点已隐藏">×'+n._dup+'</small>':'';
  return '<div class="node"><div class="nt">'+esc(title)+' '+(id!==undefined?'<small style="color:var(--muted)">#'+id+'</small>':'')+dup+'</div>'+inner+'</div>';
}


/* 版本切换改由列表页工具栏下拉控制（见 selVerHTML / changeVer）；setVer 仍供外壳 message 通知使用 */
function setVer(v){
  if(!VERSIONS.some(x=>x.id===v) || v===CUR_VER) return;
  CUR_VER=v;
  try{ localStorage.setItem('va_ver',v); }catch(e){}
  if(window.parent!==window){
    try{ window.parent.postMessage({type:'verChanged',v:v},'*'); }catch(e){}
  }
  init();
}
/* 外壳通知子页切换版本 */
addEventListener('message',function(e){
  if(e.data && e.data.type==='setVersion') setVer(e.data.v);
});

/* 从详情返回列表(浏览器后退/bfcache 恢复)时,若排序被重置则按已存选择刷新 */
addEventListener('pageshow',function(e){
  if(!e.persisted) return;
  try{
    const _s=localStorage.getItem('va_sort');
    if(SORTS.indexOf(_s)>=0 && _s!==sortBy){ sortBy=_s; renderCards(); }
  }catch(err){}
});

/* ---------- 入口（异步：先按版本加载索引） ---------- */
async function init(){
  try{ localStorage.setItem('va_ver',CUR_VER); }catch(e){}
  await loadIndex(CUR_VER);
  buildCARS(); buildFilters();
  document.getElementById('sideFoot').textContent='数据 '+CUR_VER+' · '+CARS.length+' 辆';
  applyRoute();
}
init().catch(function(err){
  const m=document.getElementById('main');
  if(m) m.innerHTML='<div class="soon-view"><div class="big">数据载入失败</div><div>'+(err&&err.message?String(err.message):'')+'</div>'+
    '<div style="font-size:12px">请确认通过 HTTP 访问，且 <code>ace/'+CUR_VER+'/vehicles.json</code> 可访问</div></div>';
});
</script>
