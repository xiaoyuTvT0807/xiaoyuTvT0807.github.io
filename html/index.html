<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="XnBteNsP3mUweHBV8snqvL">
<head data-page-node-id="g811J4FFiOiN31c98Qeus9">
<meta charset="UTF-8" data-page-node-id="SPgjdzIJZPEyLgFcf7UHd2">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="oZEu1vTb16dW0jPA4J6rMX">
<title>车辆库</title>
<style>
/* ============================================================
   设计原则（参考 2026 主流优秀站点）
   · 玻璃只用于「侧栏 / 顶栏 / 浮层」这 1–2 层，内容区一律实色白卡
   · 单一品牌色（紫），中性冷灰阶建立层级；不再使用第二强调色
   · Bento 式模块化卡片：信息密度高但不拥挤
   · 微交互克制：hover 上浮、图片微放、下拉弹出、内容淡入
   ============================================================ */
:root{
  --bg:#f3f4f7;
  --surface:#fff;
  --surface-2:rgba(244,245,248,.62);
  --ink:#23272f;
  --ink-2:#5b626e;
  --muted:#9aa1ad;
  --line:rgba(35,39,47,0.08);
  --line-2:rgba(35,39,47,0.13);
  --accent:#6d5efc;
  --accent-ink:#5a45f5;
  --accent-soft:rgba(109,94,252,0.10);
  --radius:16px;
  --radius-sm:10px;
  --sh-1:0 1px 2px rgba(35,39,47,.04), 0 1px 3px rgba(35,39,47,.05);
  --sh-2:0 10px 28px rgba(35,39,47,.10), 0 2px 6px rgba(35,39,47,.05);
  --sh-3:0 18px 44px rgba(35,39,47,.14);
  --side-w:248px;
  --font-display:'PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  --font-body:'PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-body);color:var(--ink);
  background:var(--bg);           /* 干净浅灰底：内容区实色卡，不用照片背景 */
  display:flex;height:100vh;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(109,94,252,.16);color:var(--accent-ink)}
/* ---------- 移动端点击优化：去蓝框/点按高亮/双击缩放延迟，点按更跟手 ---------- */
*{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:none}
button,.sel-btn,.chipbtn,.opt,.row,.acard,.icard,.art-hd,.run-btn,.tchip,.vh,.fhd,.catitem .ch,.mclose,.pager button,.branched-menu__item,.branched-menu__head,label{user-select:none;touch-action:manipulation;cursor:pointer}
input,textarea{touch-action:manipulation}
@media (max-width:700px){input,textarea{font-size:16px}}
.acard:active,.icard:active,.row:active,.vcard:active,.vh:active,.fhd:active,.tchip:active,.run-btn:active,.chipbtn:active{transform:scale(.97)}

/* ---------- 侧栏：唯一的玻璃层 ---------- */
.sidebar{
  width:var(--side-w);flex:0 0 var(--side-w);
  background:rgba(255,255,255,0.5);
  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 14px;gap:16px;overflow-y:auto;
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(35,39,47,.15);border-radius:3px}

/* 树形分支导航（Uiverse branched-menu，重制配色） */
.branched-menu{
  --bm-ink:var(--ink); --bm-accent:var(--accent-ink); --bm-line:var(--line-2);
  --bm-font:14px; --bm-row:38px; --bm-indent:38px; --bm-line-w:1.5;
  --bm-draw:400ms; --bm-fold:300ms; --bm-ease-out:cubic-bezier(0.23,1,0.32,1);
  --bm-muted:var(--muted);
  position:relative;display:flex;flex-direction:column;width:100%;
  padding-left:14px;color:var(--bm-ink);font-family:inherit;font-size:var(--bm-font);line-height:1.2;
}
.branched-menu::before{
  content:"";position:absolute;top:8px;bottom:0;left:0;width:2px;border-radius:1px;
  background:linear-gradient(to bottom, var(--bm-line) 0%, var(--bm-line) 55%, transparent 100%);
}
.sec-toggle,.item-radio{display:none}
.branched-menu__section{display:flex;flex-direction:column;position:relative}
.branched-menu__marker{
  position:absolute;top:10px;left:-14px;z-index:1;width:2px;height:16px;border-radius:1px;
  background:var(--bm-accent);opacity:0;transition:opacity 150ms ease;
}
.branched-menu__section:has(.sec-toggle:checked):has(.item-radio:checked) > .branched-menu__marker{opacity:1}
.branched-menu__head{
  display:block;margin:0;padding:9px 0;border:0;background:none;color:var(--bm-muted);
  font:inherit;font-size:calc(var(--bm-font) + 1px);font-weight:600;text-align:left;cursor:pointer;
  outline:none;transition:color 200ms ease;
}
.sec-toggle:checked ~ .branched-menu__head{color:var(--bm-ink)}
@media (hover:hover) and (pointer:fine){.branched-menu__head:hover{color:var(--bm-ink)}}
.branched-menu__body{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--bm-fold) var(--bm-ease-out)}
.sec-toggle:checked ~ .branched-menu__body{grid-template-rows:1fr}
.branched-menu__fold{min-height:0;overflow:hidden}
.branched-menu__tree{position:relative;padding:6px 0}
.branched-menu__lines{position:absolute;top:0;left:0;overflow:visible;opacity:0;pointer-events:none;transition:opacity 200ms ease}
.sec-toggle:checked ~ .branched-menu__body .branched-menu__lines{opacity:1;transition:opacity 250ms ease 100ms}
.branched-menu__base,.branched-menu__reach{fill:none;stroke-width:var(--bm-line-w);stroke-linecap:round;stroke-linejoin:round}
.branched-menu__base{stroke:var(--bm-line)}
.branched-menu__reach{stroke:var(--bm-accent);transition:stroke-dashoffset var(--bm-draw) var(--bm-ease-out)}
.branched-menu__item{
  display:flex;align-items:center;gap:9px;width:100%;height:var(--bm-row);margin:0;
  padding:0 8px 0 var(--bm-indent);border:0;background:none;color:var(--bm-muted);
  font:inherit;text-align:left;cursor:pointer;outline:none;border-radius:8px;
  transition:color 180ms ease, background 180ms ease;
}
@media (hover:hover) and (pointer:fine){.branched-menu__item:hover{background:rgba(35,39,47,.04);color:var(--bm-ink)}}
.item-radio:checked + .branched-menu__item{color:var(--bm-accent);font-weight:600;background:var(--accent-soft)}
.branched-menu__icon{display:inline-flex;flex:none;color:inherit}
.branched-menu__label{white-space:nowrap}
.branched-menu__soon{margin-left:auto;font-size:10px;font-weight:500;color:var(--muted);
  background:var(--surface-2);padding:2px 7px;border-radius:999px;border:1px solid var(--line)}
.side-foot{margin-top:auto;font-size:11px;color:var(--muted);text-align:center;padding-top:10px;border-top:1px solid var(--line)}

/* ---------- 侧栏顶部：数据版本下拉（全局唯一，作用于所有模块页） ---------- */
.ver-box{flex:none;padding-bottom:14px;margin-bottom:2px;border-bottom:1px solid var(--line)}
.vsel{position:relative}
.vsel-btn{display:flex;align-items:center;gap:8px;width:100%;padding:8px 11px;border-radius:var(--radius-sm);
  background:#fff;border:1px solid var(--line-2);box-shadow:var(--sh-1);cursor:pointer;
  font:inherit;font-size:12.5px;color:var(--ink-2);white-space:nowrap;transition:.15s}
.vsel-btn:hover{border-color:var(--accent);color:var(--ink)}
.vsel-btn .ic{width:18px;height:18px;flex:0 0 18px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:6px;background:rgba(35,39,47,.06);color:var(--ink-2);font-size:10px;font-weight:700;line-height:1;transition:.15s}
.vsel-btn .arrow{margin-left:auto;font-size:8px;color:var(--muted);transition:transform .2s ease;line-height:1}
.vsel-btn .vtxt{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 auto;text-align:left}
.vsel-btn .vtxt b{font-size:12.5px;font-weight:700;color:var(--ink);letter-spacing:.2px}
.vsel-btn .vtxt i{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.vsel-list .opt .hint{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.vsel.open .vsel-btn{border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 3px var(--accent-soft)}
.vsel.open .vsel-btn .ic{background:var(--accent-soft);color:var(--accent-ink)}
.vsel.open .vsel-btn .arrow{transform:rotate(180deg);color:var(--accent-ink)}
.vsel-list{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;display:none;flex-direction:column;gap:2px;
  background:#fff;border:1px solid var(--line-2);border-radius:var(--radius-sm);box-shadow:var(--sh-2);padding:5px}
.vsel.open .vsel-list{display:flex}
.vsel-list .opt{padding:7px 10px;border-radius:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;
  display:flex;align-items:center;white-space:nowrap}
.vsel-list .opt:hover{background:var(--accent-soft);color:var(--accent-ink)}
.vsel-list .opt.on{color:var(--accent-ink);font-weight:600}
.vsel-list .opt.on::after{content:"✓";margin-left:auto;font-size:11px}

/* 版本切换已移至列表页工具栏下拉（与阵营/定位同款），外壳只需同步 iframe 重载 */

/* ---------- 主区 ---------- */
.main{flex:1;overflow-y:auto;padding:0 26px 40px}
.main::-webkit-scrollbar{width:9px}
.main::-webkit-scrollbar-thumb{background:rgba(35,39,47,.16);border-radius:5px}

/* 顶栏：第二层玻璃，滚动吸顶（负边距让玻璃条全宽铺满主区） */
.toolbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px 26px 12px;margin:0 -26px 14px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--line);
}
.toolbar h2{font-family:var(--font-display);font-size:21px;font-weight:600;letter-spacing:.2px;display:flex;align-items:baseline;gap:8px}
.toolbar .count{font-family:var(--font-body);font-size:12px;font-weight:400;color:var(--muted)}
.selects{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 下拉选择 */
.sel{position:relative;min-width:124px}
.sel-btn{
  display:flex;align-items:center;gap:7px;width:100%;justify-content:flex-start;
  padding:7px 11px;border-radius:var(--radius-sm);font-size:12.5px;cursor:pointer;user-select:none;
  background:#fff;border:1px solid var(--line-2);color:var(--ink-2);
  box-shadow:var(--sh-1);transition:.15s;
}
.sel-btn:hover{border-color:var(--line-2);color:var(--ink)}
.sel-btn .ic{
  width:18px;height:18px;flex:0 0 18px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);
  font-size:10px;font-weight:700;font-family:var(--font-display);line-height:1;
}
.sel-btn .arrow{font-size:8px;color:var(--muted);margin-left:auto;transition:transform .2s ease;line-height:1}
.sel.open .sel-btn{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
.sel.open .sel-btn .arrow{transform:rotate(180deg)}
.sel[data-kind="sort"] .sel-btn{background:var(--accent-soft);border-color:rgba(109,94,252,.28);color:var(--accent-ink);font-weight:600}
.sel[data-kind="sort"] .sel-btn .ic{background:#fff}
.sel-list{
  position:absolute;top:calc(100% + 6px);left:0;min-width:100%;z-index:40;display:none;flex-direction:column;gap:2px;
  padding:6px;border-radius:var(--radius-sm);background:rgba(255,255,255,.9);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid var(--line);box-shadow:var(--sh-3);
}
.sel.open .sel-list{display:flex;animation:dropIn .16s ease}
@keyframes dropIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.sel-list .opt{padding:7px 9px;border-radius:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.sel-list .opt:hover{background:var(--accent-soft);color:var(--accent-ink)}
.sel-list .opt.on{color:var(--accent-ink);font-weight:600}
.sel-list .opt.on::after{content:"✓";margin-left:auto;font-size:11px}
.sel-list .opt .oi{width:18px;height:18px;flex:0 0 18px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:6px;background:rgba(35,39,47,.06);font-size:10px;font-weight:700;color:var(--ink-2)}
.sel-list .opt:hover .oi{background:rgba(109,94,252,.18);color:var(--accent-ink)}
.sel-list .opt.on .oi{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(109,94,252,.38)}
.sel-list .opt .hint{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:400}
.sel-list .opt.on .hint{display:none}

/* 搜索 */
.search{margin-left:auto;position:relative;display:flex;align-items:center}
.search input{
  width:236px;padding:8px 12px 8px 34px;border-radius:var(--radius-sm);
  background:#fff;border:1px solid var(--line-2);color:var(--ink);
  font-size:12.5px;outline:none;transition:.15s;box-shadow:var(--sh-1);
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search .search-ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted);opacity:.55;pointer-events:none}

/* ---------- 卡片（参考稿：大图 + 品级徽章 + 名称/厂商 + 圆角标签，无被动） ---------- */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:18px}
.grid-cards:has(.empty){display:block}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:56px 20px;color:var(--ink-2);text-align:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh-1)}
.empty-ic{width:46px;height:46px;color:var(--accent-ink);opacity:.5}
.empty-t{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--ink-2)}
.empty-s{font-size:12.5px}
.vcard{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;cursor:pointer;box-shadow:var(--sh-1);--tier:#c9d2e0;will-change:transform;
  transition:transform .22s cubic-bezier(.23,1,.32,1), box-shadow .22s, border-color .22s;
}
.vcard::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;z-index:2;
  background:linear-gradient(90deg,var(--tier),color-mix(in srgb,var(--tier) 35%,transparent));opacity:.95}
.vcard:hover{transform:translateY(-5px);box-shadow:var(--sh-3);border-color:color-mix(in srgb,var(--tier) 45%,transparent)}
.vcard:active{transform:translateY(-2px) scale(.992)}
.vcard .thumb{
  aspect-ratio:4/3.1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
  background:linear-gradient(160deg,#f0f1f4,#f6f7f9 70%);border-bottom:1px solid rgba(35,39,47,.05);
}
.vcard .thumb img{width:100%;height:100%;object-fit:contain;opacity:0;transition:transform .35s cubic-bezier(.23,1,.32,1), opacity .35s ease}
.vcard .thumb.ok img{opacity:1}
.vcard:hover .thumb img{transform:scale(1.07)}
.vcard .thumb .ph{font-family:var(--font-display);font-size:40px;font-weight:700;
  background:linear-gradient(135deg,#b9c0cc,#8a93a3);-webkit-background-clip:text;background-clip:text;color:transparent}
.vcard .thumb .ph-tip{position:absolute;bottom:9px;right:10px;font-size:9px;color:var(--muted);
  background:rgba(255,255,255,.85);padding:2px 7px;border-radius:999px;opacity:0;transition:opacity .2s}
.vcard:hover .thumb .ph-tip{opacity:1}
.vcard .grade{position:absolute;top:11px;right:11px;font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:2px;
  color:#fff;background:var(--tier,#9aa6bd);
  padding:4px 13px;border-radius:999px;box-shadow:0 4px 14px rgba(35,39,47,.22)}
.vcard .body{padding:14px 16px 16px}
.vcard .nm{font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:.2px;
  display:flex;align-items:baseline;gap:7px;min-width:0}
.vcard .nm .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcard .nm .mk{font-family:var(--font-body);font-size:12px;font-weight:400;color:var(--muted);flex:0 0 auto}
.vcard .tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}

.tag{font-size:11.5px;padding:4px 12px;border-radius:999px;background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.tag.f{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.tag.r{background:rgba(35,39,47,.05);color:var(--ink-2);border-color:var(--line)}

/* ---------- 详情 ---------- */
.back{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;color:var(--ink-2);
  margin-bottom:12px;padding:6px 12px;border-radius:var(--radius-sm);background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--sh-1);transition:.15s}
.back:hover{color:var(--ink);border-color:var(--accent)}
.back:hover .ar{transform:translateX(-3px)}
.back .ar{display:inline-block;transition:transform .18s ease}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh-1)}
.detail-wrap{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:14px;align-items:start}
.col-info{display:flex;flex-direction:column;gap:12px;min-width:0}
.col-info .card{margin-bottom:0}
.col-media{position:sticky;top:74px;display:flex;flex-direction:column;gap:12px}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh-1);padding:12px}
.hero .pic{
  aspect-ratio:16/10;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(135deg,#f0f1f4,#e9ebf0);display:flex;align-items:center;justify-content:center;position:relative;
}
.hero .pic img{width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .35s ease}
.hero .pic.ok img{opacity:1}
.hero .pic .ph{font-family:var(--font-display);font-size:42px;font-weight:700;
  background:linear-gradient(135deg,#b9c0cc,#8a93a3);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .pic .ph-tip{position:absolute;bottom:8px;right:10px;font-size:9.5px;color:var(--muted);background:rgba(255,255,255,.85);padding:2px 7px;border-radius:5px}
/* 图片加载成功后隐藏占位字与提示（透明 PNG 会透出下层） */
.thumb.ok .ph,.thumb.ok .ph-tip,.pic.ok .ph,.pic.ok .ph-tip{display:none}
.hero-cap{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font-size:11.5px;color:var(--muted)}
.hero-skins{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh-1);padding:12px}
.hero-skins .mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:9px}
.mini{text-align:center;cursor:pointer}
.mini .box{width:100%;aspect-ratio:16/10;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line);position:relative;
  background:linear-gradient(135deg,#f0f1f4,#e9ebf0);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;color:var(--accent-ink);transition:.16s}
.mini .box img{width:100%;height:100%;object-fit:contain}
.mini:hover .box{border-color:var(--accent);transform:translateY(-2px)}
.mini.on .box{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.mini .sn{font-size:10.5px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.h-title{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:.2px;
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.h-title .mk{font-family:var(--font-body);font-size:13px;font-weight:400;color:var(--muted)}
.h-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

.sec-title{font-family:var(--font-display);font-size:13.5px;font-weight:600;margin:0 0 10px;
  display:flex;align-items:center;gap:7px;color:var(--ink)}
.sec-title::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.grid.core{grid-template-columns:repeat(5,minmax(0,1fr))}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px}
.stat .k{font-size:10.5px;color:var(--muted)}
.stat .v{font-family:var(--font-display);font-size:15.5px;font-weight:600;margin-top:2px}
.stat .v small{font-size:11px;font-weight:500;color:var(--muted)}
.desc{font-size:13px;line-height:1.65;color:var(--ink-2)}
.desc.tech{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:10px 12px;font-size:12px}
.node{border-left:3px solid var(--accent-ink);background:var(--accent-soft);padding:8px 12px;
  border-radius:0 8px 8px 0;margin-bottom:6px;font-size:12.5px}
.node .nt{font-weight:600;color:var(--ink);margin-bottom:3px}
.node .nv{color:var(--ink-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
.kv .k{color:var(--muted);font-size:12px}
.chips-shapes{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto}
.shape{width:60px;flex-shrink:0;padding:7px 4px 5px;border-radius:var(--radius-sm);background:var(--surface-2);
  border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px}
.shape svg{width:26px;height:26px;stroke:var(--accent-ink);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.shape .lb{font-size:10.5px;color:var(--muted)}
video{display:block;width:100%;max-width:460px;aspect-ratio:16/9;background:#1b1e24;border-radius:var(--radius-sm);margin-top:10px;border:1px solid var(--line)}

/* 骨架屏 */
.skel{position:relative;overflow:hidden;background:rgba(35,39,47,.07);border-radius:8px}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:skel 1.3s ease-in-out infinite}
@keyframes skel{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){
  .skel::after{animation:none}
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
.skel-line{height:13px}.skel-title{height:22px}.skel-stat{height:54px}
.skel-pic{aspect-ratio:16/10;border-radius:10px}.skel-mini{aspect-ratio:16/10;border-radius:8px}
.skel-back{width:98px;height:26px;border-radius:8px}
.fade-in{animation:fadeIn .22s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.soon-view{height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted)}
.soon-view .big{font-size:44px}

/* ---------- 移动端 / 竖屏 ---------- */
.nav-toggle,.nav-mask{display:none}
@media (max-width:920px){
  html,body{height:auto;min-height:100%}
  body{display:block;overflow:auto}
  :root{--navbar-h:46px}
  /* 菜单键改为通栏顶栏，与工具栏连成一体，不再悬浮生硬 */
  .nav-toggle{
    display:flex;align-items:center;gap:8px;position:sticky;top:0;left:0;z-index:80;
    width:100%;height:var(--navbar-h);padding:0 16px;border-radius:0;
    font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;
    background:rgba(255,255,255,.82);border:none;border-bottom:1px solid var(--line);
    backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);box-shadow:none;
  }
  .nav-toggle .nav-ic{color:var(--accent-ink)}
  .nav-mask{display:block;position:fixed;inset:0;z-index:70;background:rgba(35,39,47,.30);opacity:0;pointer-events:none;transition:opacity .2s ease}
  body.nav-open .nav-mask{opacity:1;pointer-events:auto}
  .sidebar{
    position:fixed;top:var(--navbar-h);left:0;bottom:0;width:272px;max-width:82vw;z-index:75;
    border-radius:0 var(--radius) var(--radius) 0;transform:translateX(-104%);
    transition:transform .26s cubic-bezier(.23,1,.32,1);box-shadow:var(--sh-3);
  }
  body.nav-open .sidebar{transform:none}
  .main{padding:0 14px 32px;height:auto;overflow:visible}
  .toolbar{top:var(--navbar-h);margin:0 -14px 14px;padding:12px 14px 10px}
  .toolbar h2{font-size:18px}
  .search{margin-left:0;width:100%}
  .search input{width:100%}
  .detail-wrap{grid-template-columns:1fr;gap:12px}
  .col-media{position:static;order:-1}
  .grid.core{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .grid.core{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{padding:13px 14px}
  .hero-skins .mini-grid{grid-template-columns:repeat(auto-fill,minmax(58px,1fr))}
}
@media (orientation:landscape) and (max-height:560px){
  .main{padding:0 16px 24px}
  .toolbar{margin-bottom:10px}
  .grid.core{grid-template-columns:repeat(5,minmax(0,1fr))}
  .detail-wrap{grid-template-columns:minmax(0,1fr) 300px}
  .col-media{position:static}
}

/* ---------- 外壳：右侧内容区用 iframe 承载各模块 ---------- */
.main{padding:0!important;overflow:hidden}
#view{border:0;width:100%;height:100%;display:block;background:var(--bg)}
@media(max-width:920px){
  .main{height:calc(100vh - 46px);overflow:hidden;padding:0!important}
}
</style>

</head>
<body>
  <button class="nav-toggle" id="navToggle" aria-label="打开菜单"><svg class="nav-ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg> 菜单</button>
  <div class="nav-mask" id="navMask"></div>

  <aside class="sidebar">
    <div class="ver-box"><div class="vsel" id="verSel"></div></div>
    <nav class="branched-menu" id="nav"></nav>
    <div class="side-foot">车辆档案库 · 主目录</div>
  </aside>

  <main class="main">
    <iframe id="view" src="list.html" title="内容区"></iframe>
  </main>

<script src="assets/preload.js?v=20291002"></script>
<script>
/* ============================================================
   index = 外壳 + 主目录（常驻最上层，永远不变）
   右侧内容区用 iframe 承载：车辆总览 / 车辆详情 / 待加模块
   ============================================================ */
const ICONS = {
  grid:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  car:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11l1.7-4.2A2 2 0 0 1 8.6 5.5h6.8a2 2 0 0 1 1.9 1.3L19 11"/><rect x="3" y="11" width="18" height="6" rx="2"/><circle cx="7" cy="17" r="1.6"/><circle cx="17" cy="17" r="1.6"/></svg>',
  chip:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>',
  skin:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="11" r="1"/><circle cx="15.5" cy="11" r="1"/><path d="M9 16c1.5 1.5 4.5 1.5 6 0"/></svg>',
  cmp:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 7h4l-2 3 2 3H5"/><path d="M19 7h-4l2 3-2 3h4"/></svg>',
  data:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  map:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20l-5.4-2.1V4L9 6.1 15 4l5.4 2.1V18L15 15.9 9 20z"/><path d="M9 6.1V20M15 4v11.9"/></svg>',
  cal:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  season:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14-4"/><path d="M4 5v4h4"/><path d="M4 13a8 8 0 0 0 14 4"/><path d="M20 19v-4h-4"/></svg>',
  cup:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4"/><path d="M6 4h12v5a6 6 0 0 1-12 0z"/><path d="M6 6H4a2 2 0 0 0 2 4M18 6h2a2 2 0 0 1-2 4"/></svg>',
  item:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>',
  medal:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l4 6 4-6"/><circle cx="12" cy="15" r="5"/></svg>',
  book:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  patch:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 21h10M5 7h14M5 7l-2.5 6h5zM19 7l-2.5 6h5z"/></svg>'
};
const SECTIONS = [
  {title:'车辆库', checked:true, items:[
    {id:'m-veh',label:'车辆总览',icon:ICONS.grid,src:'list.html'},
    {id:'m-map',label:'地图',icon:ICONS.map,src:'map.html'},
    {id:'m-chip',label:'芯片',icon:ICONS.chip,src:'chip.html'}
  ]},
  {title:'活动与赛事', checked:false, items:[
    {id:'m-act',label:'活动',icon:ICONS.cal,src:'activities.html'},
    {id:'m-seact',label:'赛季活动',icon:ICONS.season,src:'season_activities.html'},
    {id:'m-sgod',label:'街头车神',icon:ICONS.cup,src:'street_god.html'}
  ]},
  {title:'图鉴', checked:false, items:[
    {id:'m-items',label:'道具',icon:ICONS.item,src:'items.html'},
    {id:'m-titles',label:'称号',icon:ICONS.medal,src:'titles.html'}
  ]},
  {title:'资料', checked:false, items:[
    {id:'m-intro',label:'游戏介绍',icon:ICONS.book,src:'game_intro.html'},
    {id:'m-bal',label:'平衡性更新',icon:ICONS.patch,src:'balance_updates.html'}
  ]},
  {title:'数据模块', checked:false, items:[
    {id:'m-cmp',label:'版本对比',icon:ICONS.cmp,src:'diff.html'}
  ]}
];

/* 内容页文件名 → 主目录项 id（点选时高亮对应节点；详情页归到车辆总览下） */
const NAV_ID={
  'list.html':'m-veh','car.html':'m-veh','map.html':'m-map','chip.html':'m-chip',
  'activities.html':'m-act','season_activities.html':'m-seact','street_god.html':'m-sgod',
  'items.html':'m-items','titles.html':'m-titles','game_intro.html':'m-intro','balance_updates.html':'m-bal',
  'diff.html':'m-cmp'
};

/* ---------- 版本管理 ---------- */
/* 版本清单；数据文件由子页原生 fetch：ace/<版本>/vehicles.json */
const VERSIONS = [
  {id:'29836883', label:'29836883', data:'../ace/29836883/vehicles.json'},
  {id:'29842023', label:'29842023', data:'../ace/29842023/vehicles.json'}
];
const DEFAULT_VER = '29842023';
function getVerParam(){
  const h=(location.hash||'').replace(/^#/,'');
  const q=new URLSearchParams(h.indexOf('?')>=0?h.slice(h.indexOf('?')):'');
  let v=q.get('v');
  if(!v){ try{ v=localStorage.getItem('va_ver'); }catch(e){} }
  return VERSIONS.some(x=>x.id===v) ? v : DEFAULT_VER;
}
let CUR_VER = getVerParam();

/* 版本号 → 时间：版本号是「Unix 时间戳的分钟数」（29836883 × 60 = 1790212980 → 2026-09-24 09:23） */
function verTime(id){
  const n=Number(id);
  if(!isFinite(n)||n<=0) return '';
  const d=new Date(n*60000), p=v=>String(v).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

/* ===== 侧栏顶部：版本下拉（全局唯一；子页被嵌入时不再重复显示自己的版本下拉） ===== */
const verSel=document.getElementById('verSel');
function renderVer(){
  /* 版本下拉始终按「最新在前」展示（版本号 = 分钟时间戳，越大越新） */
  const vers=VERSIONS.slice().sort(function(a,b){ return Number(b.id)-Number(a.id); });
  verSel.innerHTML='<button class="vsel-btn" type="button"><span class="ic">版</span>'+
    '<span class="vtxt"><b>'+CUR_VER+'</b><i>'+verTime(CUR_VER)+'</i></span>'+
    '<span class="arrow">▼</span></button>'+
    '<div class="vsel-list">'+vers.map(function(x){
      const t=verTime(x.id);
      return '<div class="opt'+(x.id===CUR_VER?' on':'')+'" data-v="'+x.id+'" title="'+t+'">'+
        '<span>'+x.label+'</span>'+(t?'<span class="hint">'+t.slice(0,10)+'</span>':'')+'</div>';
    }).join('')+'</div>';
}
verSel.addEventListener('click',function(e){
  const opt=e.target.closest('.opt');
  if(opt){ verSel.classList.remove('open'); setVer(opt.getAttribute('data-v')); return; }
  if(e.target.closest('.vsel-btn')) verSel.classList.toggle('open');
});
document.addEventListener('click',function(e){ if(!e.target.closest('#verSel')) verSel.classList.remove('open'); });
renderVer();
/* 给列表/详情地址补上版本参数（待加模块不带版本） */
function withVer(src){
  if(src.indexOf('soon.html')===0) return src;
  const u=new URL(src, location.href);
  u.searchParams.set('v', CUR_VER);
  return u.pathname + (u.search||'') + (src.indexOf('#')>=0?src.slice(src.indexOf('#')):'');
}

const nav=document.getElementById('nav'), view=document.getElementById('view');
function branchSVG(n){
  const baseY=14+(n-1)*38;
  let s='<path class="branched-menu__base" d="M 14 0 V '+baseY+'"></path>';
  for(let i=0;i<n;i++){
    const b=14+i*38, e=b+10, len=(b+Math.PI*10/2+8).toFixed(2);
    s+='<path class="branched-menu__base" d="M 14 '+b+' A 10 10 0 0 0 24 '+e+' H 32"></path>';
    s+='<path class="branched-menu__reach" d="M 14 0 V '+b+' A 10 10 0 0 0 24 '+e+' H 32" style="stroke-dasharray:'+len+';stroke-dashoffset:'+len+';"></path>';
  }
  return '<svg class="branched-menu__lines" width="40" height="'+(n*38+12)+'" aria-hidden="true">'+s+'</svg>';
}
function drawReach(radio){
  const sec=radio.closest('.branched-menu__section');
  const reaches=Array.prototype.slice.call(sec.querySelectorAll('.branched-menu__reach'));
  reaches.forEach(function(r){r.style.strokeDashoffset=r.style.strokeDasharray;});
  const items=Array.prototype.slice.call(sec.querySelectorAll('.branched-menu__item'));
  const lbl=document.querySelector('label[for="'+radio.id+'"]');
  const idx=items.indexOf(lbl);
  if(reaches[idx]) reaches[idx].style.strokeDashoffset='0';
}
function buildNav(){
  nav.innerHTML=SECTIONS.map(function(sec,si){
    const items=sec.items.map(function(it){
      return '<input type="radio" name="menu-item" id="'+it.id+'" class="item-radio"'+((it.id==='m-veh')?' checked':'')+'>\n'+
      '<label for="'+it.id+'" class="branched-menu__item"'+(it.src?' data-src="'+it.src+'"':'')+
        (it.soon?' data-soon="'+it.label+'"':'')+'>'+
      '<span class="branched-menu__icon">'+it.icon+'</span>'+
      '<span class="branched-menu__label">'+it.label+'</span>'+
      (it.soon?'<span class="branched-menu__soon">待加</span>':'')+'</label>';
    }).join('');
    return '<div class="branched-menu__section">'+
      '<input type="checkbox" id="sec-'+si+'" class="sec-toggle"'+(sec.checked?' checked':'')+'>\n'+
      '<span class="branched-menu__marker" aria-hidden="true"></span>\n'+
      '<label for="sec-'+si+'" class="branched-menu__head">'+sec.title+'</label>'+
      '<div class="branched-menu__body"><div class="branched-menu__fold"><div class="branched-menu__tree">'+
      branchSVG(sec.items.length)+items+'</div></div></div></div>';
  }).join('');
  nav.querySelectorAll('.branched-menu__item').forEach(function(lbl){
    lbl.addEventListener('click',function(){
      const radio=document.getElementById(lbl.getAttribute('for'));
      if(radio) drawReach(radio);
      if(lbl.dataset.src) openSrc(lbl.dataset.src);
      else if(lbl.dataset.soon) openSrc('soon.html?m='+encodeURIComponent(lbl.dataset.soon));
      setNav(false);
    });
  });
}
buildNav();

/* ===== 内容区切换（只换 iframe，主目录不动） ===== */
function openSrc(src){
  const full=withVer(src);
  if(view.getAttribute('data-src')===src) view.src=full;   // 同模块强制刷新（换车辆 / 换版本）
  else view.setAttribute('data-src',src);
  view.src=full;
  try{ history.replaceState(null,'','#'+full); }catch(e){}
  const r=NAV_ID[src.split('?')[0]]||null;
  if(r){ const el=document.getElementById(r); if(el&&!el.checked){ el.checked=true; drawReach(el); } }
}
window.openCar=function(id,v){ if(v) CUR_VER=v; openSrc('car.html?id='+encodeURIComponent(id)); };
window.openList=function(){ openSrc('list.html'); };

/* ===== 版本切换：由侧栏顶部的版本下拉触发，切完重载当前模块 ===== */
function setVer(v){
  if(!VERSIONS.some(x=>x.id===v) || v===CUR_VER) return;
  CUR_VER=v;
  try{ localStorage.setItem('va_ver',v); }catch(e){}
  renderVer();
  openSrc(view.getAttribute('data-src')||'list.html');   // 重新载入当前模块（带新版本）
}

addEventListener('popstate',function(){
  const h=(location.hash||'').replace(/^#/,'');
  if(h) openSrc(h);
});
const initHash=(location.hash||'').replace(/^#/,'');
if(initHash) openSrc(initHash);
else openSrc('list.html');   // 初始即带版本参数载入列表

/* ===== 移动端抽屉 ===== */
const navToggle=document.getElementById('navToggle'), navMask=document.getElementById('navMask');
function setNav(open){document.body.classList.toggle('nav-open',open);}
navToggle.onclick=function(){setNav(!document.body.classList.contains('nav-open'));};
navMask.onclick=function(){setNav(false);};
addEventListener('keydown',function(e){if(e.key==='Escape')setNav(false);});

/* ===== 打开网站即后台预取全部版本的数据，预览秒开 ===== */
if(window.AceDataCache){
  var _pre=(window.requestIdleCallback||function(fn){return setTimeout(fn,50)});
  _pre(function(){ AceDataCache.preloadAll(); });
}
</script>
</body>
