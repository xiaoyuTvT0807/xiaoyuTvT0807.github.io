<title>车辆详情 · 车辆档案库</title>
<style>
:root{
  --bg:#f3f4f7; --surface:#fff; --ink:#23272f; --ink-2:#5b626e; --muted:#9aa1ad;
  --line:rgba(35,39,47,.08); --line-2:rgba(35,39,47,.13);
  --accent:#6d5efc; --accent-ink:#5a45f5; --accent-soft:rgba(109,94,252,.10);
  --radius:16px; --radius-sm:10px;
  --sh-1:0 1px 2px rgba(35,39,47,.04),0 1px 3px rgba(35,39,47,.05);
  --sh-2:0 10px 28px rgba(35,39,47,.10),0 2px 6px rgba(35,39,47,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
  color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
  min-height:100vh;padding-bottom:60px;
}
a{color:inherit;text-decoration:none}
/* ---------- 移动端点击优化：去蓝框/点按高亮/双击缩放延迟，点按更跟手 ---------- */
*{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:none}
button,.sel-btn,.chipbtn,.opt,.row,.acard,.icard,.art-hd,.run-btn,.tchip,.vh,.fhd,.catitem .ch,.mclose,.pager button,.branched-menu__item,.branched-menu__head,label{user-select:none;touch-action:manipulation;cursor:pointer}
input,textarea{touch-action:manipulation}
@media (max-width:700px){input,textarea{font-size:16px}}
.acard:active,.icard:active,.row:active,.vcard:active,.vh:active,.fhd:active,.tchip:active,.run-btn:active,.chipbtn:active{transform:scale(.97)}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:12px 20px;background:rgba(255,255,255,.72);
  backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;white-space:nowrap}
.brand svg{color:var(--accent)}
.spacer{flex:1}
.search{position:relative;flex:0 1 320px;min-width:150px}
.search input{
  width:100%;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);
  background:#fff;font-size:13px;color:var(--ink);outline:none;font-family:inherit;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* ---------- 左侧常驻目录（主页同款 branched-menu） ---------- */
.layout{display:block}
.side{
  position:fixed;top:59px;bottom:0;left:0;z-index:10;width:248px;
  overflow-y:auto;background:rgba(255,255,255,.5);
  backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 14px;gap:16px;
}
.side::-webkit-scrollbar{width:6px}
.side::-webkit-scrollbar-thumb{background:rgba(35,39,47,.15);border-radius:3px}
.content{margin-left:248px;min-width:0}

/* 树形分支导航（与主页完全同款） */
.branched-menu{
  --bm-ink:var(--ink); --bm-accent:var(--accent-ink); --bm-line:var(--line-2);
  --bm-font:14px; --bm-row:38px; --bm-indent:38px; --bm-line-w:1.5;
  --bm-draw:400ms; --bm-fold:300ms; --bm-ease-out:cubic-bezier(0.23,1,0.32,1);
  --bm-muted:var(--muted);
  position:relative;display:flex;flex-direction:column;width:100%;
  padding-left:14px;color:var(--bm-ink);font-family:inherit;font-size:var(--bm-font);line-height:1.2;
}
.branched-menu::before{
  content:"";position:absolute;top:8px;bottom:0;left:0;width:2px;border-radius:1px;
  background:linear-gradient(to bottom, var(--bm-line) 0%, var(--bm-line) 55%, transparent 100%);
}
.sec-toggle,.item-radio{display:none}
.branched-menu__section{display:flex;flex-direction:column;position:relative}
.branched-menu__marker{
  position:absolute;top:10px;left:-14px;z-index:1;width:2px;height:16px;border-radius:1px;
  background:var(--bm-accent);opacity:0;transition:opacity 150ms ease;
}
.branched-menu__section:has(.sec-toggle:checked):has(.item-radio:checked) > .branched-menu__marker{opacity:1}
.branched-menu__head{
  display:block;margin:0;padding:9px 0;border:0;background:none;color:var(--bm-muted);
  font:inherit;font-size:calc(var(--bm-font) + 1px);font-weight:600;text-align:left;cursor:pointer;
  outline:none;transition:color 200ms ease;
}
.sec-toggle:checked ~ .branched-menu__head{color:var(--bm-ink)}
@media (hover:hover) and (pointer:fine){.branched-menu__head:hover{color:var(--bm-ink)}}
.branched-menu__body{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--bm-fold) var(--bm-ease-out)}
.sec-toggle:checked ~ .branched-menu__body{grid-template-rows:1fr}
.branched-menu__fold{min-height:0;overflow:hidden}
.branched-menu__tree{position:relative;padding:6px 0}
.branched-menu__lines{position:absolute;top:0;left:0;overflow:visible;opacity:0;pointer-events:none;transition:opacity 200ms ease}
.sec-toggle:checked ~ .branched-menu__body .branched-menu__lines{opacity:1;transition:opacity 250ms ease 100ms}
.branched-menu__base,.branched-menu__reach{fill:none;stroke-width:var(--bm-line-w);stroke-linecap:round;stroke-linejoin:round}
.branched-menu__base{stroke:var(--bm-line)}
.branched-menu__reach{stroke:var(--bm-accent);transition:stroke-dashoffset var(--bm-draw) var(--bm-ease-out)}
.branched-menu__item{
  display:flex;align-items:center;gap:9px;width:100%;height:var(--bm-row);margin:0;
  padding:0 8px 0 var(--bm-indent);border:0;background:none;color:var(--bm-muted);
  font:inherit;text-align:left;cursor:pointer;outline:none;border-radius:8px;
  transition:color 180ms ease, background 180ms ease;
}
@media (hover:hover) and (pointer:fine){.branched-menu__item:hover{background:rgba(35,39,47,.04);color:var(--bm-ink)}}
.item-radio:checked + .branched-menu__item{color:var(--bm-accent);font-weight:600;background:var(--accent-soft)}
.branched-menu__icon{display:inline-flex;flex:none;color:inherit}
.branched-menu__label{white-space:nowrap}
.branched-menu__soon{margin-left:auto;font-size:10px;font-weight:500;color:var(--muted);
  background:var(--surface-2);padding:2px 7px;border-radius:999px;border:1px solid var(--line)}
.side-foot{margin-top:auto;font-size:11px;color:var(--muted);text-align:center;padding-top:10px;border-top:1px solid var(--line)}
/* ---------- 窄屏：目录仍常驻，整体收窄 ---------- */
@media(max-width:900px){
  .topbar{padding:10px 12px;gap:8px}
  .brand .bt{display:none}              /* 车辆库 文字隐藏，留返回箭头 */
  .search{flex:1 1 110px;min-width:90px}
  .side{top:55px;width:212px;padding:16px 10px}
  .content{margin-left:212px}
  .branched-menu{--bm-font:13px;--bm-row:34px;--bm-indent:30px}
  .wrap{padding:14px 12px}
}
@media(max-width:560px){
  .topbar{gap:6px}
  .side{width:184px;padding:14px 8px}
  .content{margin-left:184px}
  .branched-menu{--bm-font:12.5px;--bm-row:32px;--bm-indent:26px}
  .wrap{padding:12px 8px}
}

/* ---------- 布局 ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px}
.detail{display:grid;grid-template-columns:380px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:960px){ .detail{grid-template-columns:1fr} }
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--sh-1);margin-bottom:16px;
}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:12px}

/* ---------- Hero ---------- */
.hero .pic{
  position:relative;aspect-ratio:16/10;border-radius:var(--radius-sm);overflow:hidden;
  background:linear-gradient(135deg,#f2f3f6,#e9ecf1);display:flex;align-items:center;justify-content:center;
}
.hero .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.hero .pic .ini,.hero .ph{font-size:52px;font-weight:700;color:#c3c9d4}
.hero-cap{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}
.hero-cap b{color:var(--ink);font-weight:600}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.mini{cursor:pointer;text-align:center}
.mini .box{
  position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(135deg,#f2f3f6,#e9ecf1);display:flex;align-items:center;justify-content:center;
}
.mini .box img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.mini .box .ini{font-size:16px;font-weight:700;color:#c3c9d4}
.mini.on .box{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.mini .sn{font-size:10.5px;color:var(--ink-2);margin-top:4px;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- 标题区 ---------- */
.h-title{font-size:24px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.h-title .mk{font-size:13px;font-weight:500;color:var(--muted)}
.h-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{
  font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);
  background:#fff;color:var(--ink-2);white-space:nowrap;
}
.tag.id{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--muted)}
.desc{margin-top:12px;font-size:13.5px;line-height:1.75;color:var(--ink-2);white-space:pre-wrap}
.desc.tech{font-size:12.5px;color:var(--muted);background:#f7f8fa;border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:10px 12px}

/* ---------- 数据格 ---------- */
.grid.core{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.stat{background:#f7f8fa;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px}
.stat .k{font-size:11px;color:var(--muted)}
.stat .v{font-size:16px;font-weight:700;margin-top:3px}
.stat .v small{font-size:11px;font-weight:500;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px;line-height:1.7}
.kv .k{color:var(--muted);white-space:normal;word-break:break-all;max-width:16em}
.kv .v{color:var(--ink);word-break:break-all}
@media(max-width:900px){
  .kv{grid-template-columns:1fr;gap:2px 0}
  .kv .k{max-width:none;font-weight:600;margin-top:4px}
}

/* ---------- 大招 / SP ---------- */
.ult-head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.ult-ic{position:relative;width:52px;height:52px;flex:0 0 52px;border-radius:12px;overflow:hidden;
  border:1px solid var(--line);background:#f7f8fa;display:flex;align-items:center;justify-content:center}
.ult-ic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ult-ic .ini{font-size:18px;font-weight:700;color:#c3c9d4}
.ult-name{font-size:16px;font-weight:700}
.ult-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
video{width:100%;border-radius:var(--radius-sm);margin-top:12px;background:#000;display:block}

/* ---------- 被动 / 节点 ---------- */
.node{border-left:2px solid var(--accent);padding:8px 0 8px 12px;margin-top:10px}
.node .nt{font-size:13.5px;font-weight:700}
.node .nt small{font-weight:500}
.node .nt .dup{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;background:#eceef3;
  color:var(--muted);font-size:10px;font-weight:600;vertical-align:1px;cursor:help}
.node .nv{font-size:12.5px;color:var(--ink-2);line-height:1.7;margin-top:3px;white-space:pre-wrap}
.node.sub{border-left-color:var(--line-2);margin-left:12px}

/* ---------- 芯片 ---------- */
.chips-shapes{display:flex;gap:10px;flex-wrap:nowrap;overflow-x:auto}
.shape{text-align:center;width:56px;flex-shrink:0}
.shape svg{width:28px;height:28px;fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
.shape .lb{font-size:10.5px;color:var(--muted);margin-top:2px}

/* ---------- 关系 ---------- */
.rel-group{margin-bottom:10px}
.rel-group .rl{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-link{
  font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line-2);
  background:#fff;cursor:pointer;color:var(--ink-2);
}
.chip-link:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.chip-link.bad:hover{border-color:#e5484d;color:#e5484d;background:rgba(229,72,77,.08)}

/* ---------- 列表（无 id 时） ---------- */
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pcard{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s;
}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:var(--accent)}
.pcard .pimg{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#f2f3f6,#e9ecf1);
  display:flex;align-items:center;justify-content:center}
.pcard .pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pcard .pimg .ini{font-size:22px;font-weight:700;color:#c3c9d4}
.pcard .pbody{padding:10px 12px}
.pcard .pn{font-size:13px;font-weight:600;line-height:1.3;height:2.6em;overflow:hidden}
.pcard .pm{font-size:11px;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}

/* ---------- 状态 ---------- */
.msg{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.9}
.msg code{background:#eceef2;padding:2px 6px;border-radius:5px;font-size:12.5px}
.skel{background:linear-gradient(90deg,#eceef2 25%,#f5f6f8 37%,#eceef2 63%);
  background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:8px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ---------- 版本切换标签（主目录底部） ---------- */
.ver-tabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:12px;margin-top:4px;border-top:1px solid var(--line)}
.ver-tabs .vt-hd{font-size:11px;color:var(--muted);width:100%;margin-bottom:2px}
.ver-tabs .vt{font-size:11.5px;padding:4px 12px;border-radius:999px;border:1px solid var(--line-2);
  background:#fff;color:var(--ink-2);cursor:pointer;transition:.15s;user-select:none}
.ver-tabs .vt:hover{border-color:var(--accent);color:var(--accent-ink)}
.ver-tabs .vt.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(109,94,252,.30)}
/* iframe 模式下隐藏自身版本标签（由外壳主目录提供） */
html.embedded .ver-tabs{display:none}

/* ---------- 被外壳 iframe 载入时：隐藏自身目录（主目录由外壳提供） ---------- */
html.embedded .side{display:none!important}
html.embedded .content{margin-left:0}
</style>

/* ---------- 版本管理 ---------- */

const VERSIONS = [

function getVerParam(){
  const p=new URLSearchParams(location.search);
  let v=p.get('v');
  if(!v){ const h=new URLSearchParams(location.hash.replace(/^#/,'%23')); v=h.get('v'); }
  if(!v){ try{ v=localStorage.getItem('va_ver'); }catch(e){} }
  return VERSIONS.some(x=>x.id===v) ? v : DEFAULT_VER;
}
function verCfg(v){ return VERSIONS.find(x=>x.id===v) || VERSIONS[0]; }
const resolveDataUrl = v => verCfg(v).data || 'vehicles.json';
let CUR_VER = getVerParam();

if(window.parent!==window) document.documentElement.classList.add('embedded');

function rebuildIndex(){

  for(const k in byId) delete byId[k];

}
/* 原生读取该版本的合并 JSON，展开成索引 + 整车档案缓存 */
async function loadIndex(v){
  const _fetch = (window.AceDataCache&&AceDataCache.fetchData)||fetch;
  const r = await _fetch(resolveDataUrl(v));
  if(!r.ok) throw new Error('HTTP '+r.status);
  const data = await r.json();
  CAR_FULL = Object.create(null);
  const list = [];
  Object.keys(data).forEach(function(k){
    const rec = data[k] && data[k]['车辆档案'] ? data[k]['车辆档案'] : data[k];
    if(!rec || typeof rec!=='object') return;
    const b=rec['基础']||{}, t=rec['车辆缩略图']||{};
    const id=b['数据ID'];
    CAR_FULL[String(id)] = rec;
    list.push({
      id:id, name:b['名称']||('ID '+id), maker:b['厂商'],
      camp:b['阵营'], role:b['定位'], track:b['赛道专精'], drive:b['驱动方式'],
      grade:b['品级'], skill:b['技能简述'],
      thumb:t['图标b']||t['图标m']||t['图标s']||'',
      file:String(id)
    });
  });
  list.sort(function(a,b){return (a.id||0)-(b.id||0);});
  window.INDEX = list;
  rebuildIndex();
}

const app = document.getElementById('app');
const esc = s => String(s===undefined||s===null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt = v => (v===undefined||v===null||v==='') ? '—' : v;
const pct = v => (v===undefined||v===null||v==='') ? null : (Math.round(v/100*100)/100)+'%';
// 技能文本里内嵌的 #rrggbb 颜色代码渲染为对应颜色
/* 注意：游戏文本里的 #ffffff（近似白色）本意是「恢复默认颜色」，
   若按白色渲染，白底卡片上这段文字会直接消失（全库 108 处、77 辆车受影响）。
   另：亮度过高的颜色在白底上几乎看不清，统一压暗到可读范围。 */
const clean = (function(){
  const ent={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
  const escHtml=s=>String(s).replace(/[&<>"']/g,m=>ent[m]);
  const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const lin=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)};
  const h2=v=>v.toString(16).padStart(2,'0');
  return function(s){
    if(s===undefined||s===null) return '';
    const parts=String(s).split(/(#[0-9a-fA-F]{6})/);
    let cur=null,out='';
    for(const p of parts){
      if(!p) continue;
      if(/^#[0-9a-fA-F]{6}$/.test(p)){ cur=p.toLowerCase(); continue; }
      if(!cur){ out+=escHtml(p); continue; }
      let [r,g,b]=rgb(cur);
      if(Math.min(r,g,b)>=232){ out+=escHtml(p); continue; }   // 近白 → 当作「默认颜色」
      let L=0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b), i=0;
      while(L>0.72&&i<24){ r=Math.round(r*.88); g=Math.round(g*.88); b=Math.round(b*.88);
        L=0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b); i++; }
      out+='<span style="color:#'+h2(r)+h2(g)+h2(b)+'">'+escHtml(p)+'</span>';
    }
    return out;
  };
})();

function tierOf(g){
  g=Number(g)||0;
  const m={1:['普通','#9aa6bd'],2:['稀有','#3b82f6'],3:['史诗','#a855f7'],4:['传说','#f5a623']};
  return {name:m[g]?m[g][0]:'未知',color:m[g]?m[g][1]:'#9aa6bd'};
}
/* 图片：主地址失败后依次尝试备选地址，全失败则移除（露出占位字） */
function imgFb(el){
  const rest=(el.getAttribute('data-fb')||'').split('|').filter(Boolean);
  if(rest.length){ const n=rest.shift(); el.setAttribute('data-fb',rest.join('|')); el.src=n; }
  else el.remove();
}
function pic(urls, initial, cls){
  urls=(urls||[]).filter(Boolean);
  if(!urls.length) return '<span class="ini">'+esc(initial||'?')+'</span>';
  return '<span class="ini">'+esc(initial||'?')+'</span>'+
         '<img src="'+esc(urls[0])+'" data-fb="'+esc(urls.slice(1).join('|'))+'" loading="lazy" decoding="async" onerror="imgFb(this)">';
}
function thumbUrl(t){
  if(!IMGS_READY) return '';
  t=t||{};
  const b=t['图标b']||t['图标m']||t['图标s']; if(!b) return '';
  return ICON_BASE + b.replace(/_(?:s|b|m)\.png$/i,'_m.png');
}
function fullUrls(t){
  if(!IMGS_READY) return [];
  t=t||{};
  const m=t['图标m'], b=t['图标b'], s=t['图标s'];
  const u=[];
  if(m) u.push(ICON_BASE+m);
  if(b) u.push(ICON_BASE+b.replace(/_b\.png$/i,'_m.png'), ICON_BASE+b);
  if(s) u.push(ICON_BASE+s.replace(/_s\.png$/i,'_m.png'), ICON_BASE+s);
  return u.filter((v,i)=>u.indexOf(v)===i);
}
function skinUrl(name){
  if(!IMGS_READY||!name) return '';
  const m=name.replace(/_s\.png$/i,'_m.png');
  const u=[ICON_BASE+m]; if(m!==name) u.push(ICON_BASE+name);
  return u.filter((v,i)=>u.indexOf(v)===i);
}

/* ---------- 小组件 ---------- */
function stat(k,v,unit,raw){
  if(v===undefined||v===null||v==='') return '';
  return '<div class="stat"'+(raw!==undefined&&raw!==null&&raw!==''?' title="原始值 '+esc(raw)+'"':'')+'>'+
    '<div class="k">'+k+'</div><div class="v">'+esc(v)+(unit?'<small> '+unit+'</small>':'')+'</div></div>';
}
function kv(k,v){ return '<div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div>'; }
/* 技能节点排序：效果节点（有节点ID/节点名）排前，判断节点（有判断节点ID/条件）排后，各自按名称/ID 升序 */
function sortNodes(nodes){
  if(!Array.isArray(nodes)) return [];
  return nodes.slice().sort(function(a,b){
    const aJudge=(a.判断节点ID!==undefined||a.条件!==undefined)?1:0;
    const bJudge=(b.判断节点ID!==undefined||b.条件!==undefined)?1:0;
    if(aJudge!==bJudge) return aJudge-bJudge;
    const aName=String(a.节点名||a.条件||'');
    const bName=String(b.节点名||b.条件||'');
    if(aName!==bName) return aName.localeCompare(bName,'zh');
    return (a.节点ID||a.判断节点ID||0)-(b.节点ID||b.判断节点ID||0);
  });
}
/* 取出节点「实际会显示」的字段（与 renderNode 同一套过滤规则） */
function nodePairs(n){
  const pairs=[];
  for(const k in n){
    if(String(k).charAt(0)==='_') continue;
    if(['节点名','节点ID','判断节点ID','条件','分支','效果节点'].indexOf(k)>=0) continue;
    if(/是否携带|芯片/.test(k)) continue;   // 同类字段一并隐藏
    const val=n[k];
    if(k==='描述'&&(!val||/\{.*\}/.test(val))) continue;
    if(Array.isArray(val)) continue;
    pairs.push([k,val]);
  }
  return pairs;
}
const hiddenNode=n=>/是否携带|芯片/.test(String(n.节点名||n.条件||''));
/* 节点签名：只看「屏幕上显示出来的内容」，忽略内部 ID。
   数据里大量存在「同名 + 同字段、只有节点ID/内部引用ID 递增」的重复节点（如 800951~800960），
   这类节点整块隐藏，只在保留的那个上标一个 ×N。 */
function nodeSig(n){ return JSON.stringify([n.节点名||n.条件||'节点',nodePairs(n)]); }
function dedupeNodes(list){
  if(!Array.isArray(list)) return [];
  const seen={}, out=[];
  list.forEach(function(n){
    if(!n||hiddenNode(n)) return;          // 条件判断节点（是否携带/芯片）本来就不显示
    const s=nodeSig(n);
    if(seen[s]){ seen[s]._dup++; return; } // 与前面某个节点完全一样 → 直接隐藏
    const c=Object.assign({},n); c._dup=1; seen[s]=c; out.push(c);
  });
  return out;
}
function renderNode(n){
  if(!n) return '';
  const title=n.节点名||n.条件||'节点', id=(n.节点ID!==undefined?n.节点ID:n.判断节点ID);
  // 内部条件判断节点（如「是否携带大招芯片」）自动隐藏
  if(hiddenNode(n)) return '';
  const pairs=nodePairs(n);
  if(!pairs.length) return '';   // 过滤后没内容就整块不显示
  const dup=n._dup>1?'<small class="dup" title="另有 '+(n._dup-1)+' 个内容完全相同的节点已隐藏">×'+n._dup+'</small>':'';
  return '<div class="node sub"><div class="nt">'+esc(title)+(id!==undefined?' <small style="color:var(--muted)">#'+esc(id)+'</small>':'')+dup+'</div>'+
    '<div class="kv">'+pairs.map(p=>kv(p[0],p[1])).join('')+'</div></div>';
}
function shapeSVG(name){
  const n=String(name||''), V='viewBox="0 0 24 24"';
  const pp=function(sides,r,off){ r=r||8.5; const p=[];
    for(let i=0;i<sides;i++){const a=-Math.PI/2+(off||0)+i*2*Math.PI/sides;p.push((12+r*Math.cos(a)).toFixed(1)+','+(12+r*Math.sin(a)).toFixed(1));}
    return p.join(' '); };
  if(n.indexOf('圆')>=0)  return '<svg '+V+'><circle cx="12" cy="12" r="8.5"/></svg>';
  if(n.indexOf('三角')>=0)return '<svg '+V+'><polygon points="'+pp(3,9)+'"/></svg>';
  if(n.indexOf('菱形')>=0)return '<svg '+V+'><polygon points="'+pp(4,9)+'"/></svg>';
  if(/V/i.test(n))        return '<svg '+V+'><path d="M5 5 L12 19 L19 5"/></svg>';
  const m=n.match(/(\d+)/); const sides=m?Math.max(3,+m[1]):(n.indexOf('六')>=0?6:5);
  const off=sides===6?Math.PI/6:0; // 六边形横底朝下（旋转 30°）
  return '<svg '+V+'><polygon points="'+pp(sides,9,off)+'"/></svg>';
}

const ICONS={
  grid:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  car:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11l1.7-4.2A2 2 0 0 1 8.6 5.5h6.8a2 2 0 0 1 1.9 1.3L19 11"/><rect x="3" y="11" width="18" height="6" rx="2"/><circle cx="7" cy="17" r="1.6"/><circle cx="17" cy="17" r="1.6"/></svg>',
  chip:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>',
  skin:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="8.5" cy="11" r="1"/><circle cx="15.5" cy="11" r="1"/><path d="M9 16c1.5 1.5 4.5 1.5 6 0"/></svg>',
  cmp:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 7h4l-2 3 2 3H5"/><path d="M19 7h-4l2 3-2 3h4"/></svg>',
  data:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'
};
const SECTIONS=[
  {title:'车辆库', checked:true, items:[
    {id:'m-veh',label:'车辆总览',icon:ICONS.grid,href:'index.html'},
    {id:'m-car',label:'车辆详情',icon:ICONS.car,current:true}
  ]},
  {title:'数据模块', checked:false, items:[
    {id:'m-chip',label:'芯片',icon:ICONS.chip,soon:true},
    {id:'m-skin',label:'皮肤',icon:ICONS.skin,soon:true},
    {id:'m-cmp', label:'对比',icon:ICONS.cmp,soon:true},
    {id:'m-data',label:'数据',icon:ICONS.data,soon:true}
  ]}
];
function branchSVG(n){
  const baseY=14+(n-1)*38;
  let s='<path class="branched-menu__base" d="M 14 0 V '+baseY+'"></path>';
  for(let i=0;i<n;i++){
    const b=14+i*38, e=b+10, len=(b+Math.PI*10/2+8).toFixed(2);
    s+='<path class="branched-menu__base" d="M 14 '+b+' A 10 10 0 0 0 24 '+e+' H 32"></path>';
    s+='<path class="branched-menu__reach" d="M 14 0 V '+b+' A 10 10 0 0 0 24 '+e+' H 32" style="stroke-dasharray:'+len+';stroke-dashoffset:'+len+';"></path>';
  }
  return '<svg class="branched-menu__lines" width="40" height="'+(n*38+12)+'" aria-hidden="true">'+s+'</svg>';
}
function buildNav(){
  sideEl.innerHTML=SECTIONS.map(function(sec,si){
    const items=sec.items.map(function(it,ii){
      return '<input type="radio" name="menu-item" id="'+it.id+'" class="item-radio"'+(it.current?' checked':'')+'>\n'+
      '<label for="'+it.id+'" class="branched-menu__item"'+(it.href?' data-href="'+it.href+'"':'')+'>'+
      '<span class="branched-menu__icon">'+it.icon+'</span>'+
      '<span class="branched-menu__label">'+it.label+'</span>'+
      (it.soon?'<span class="branched-menu__soon">待加</span>':'')+'</label>';
    }).join('');
    return '<div class="branched-menu__section">'+
      '<input type="checkbox" id="sec-'+si+'" class="sec-toggle"'+(sec.checked?' checked':'')+'>\n'+
      '<span class="branched-menu__marker" aria-hidden="true"></span>\n'+
      '<label for="sec-'+si+'" class="branched-menu__head">'+sec.title+'</label>'+
      '<div class="branched-menu__body"><div class="branched-menu__fold"><div class="branched-menu__tree">'+
      branchSVG(sec.items.length)+items+'</div></div></div></div>';
  }).join('');
  const def=sideEl.querySelector('.item-radio:checked');
  if(def){
    const tree=def.closest('.branched-menu__section').querySelector('.branched-menu__tree');
    const r=tree.querySelectorAll('.branched-menu__reach'); if(r[0]) r[0].style.strokeDashoffset='0';
  }
  sideEl.querySelectorAll('.branched-menu__item').forEach(function(lbl){
    lbl.addEventListener('click',function(){
      const sec=lbl.closest('.branched-menu__section');
      const reaches=Array.prototype.slice.call(sec.querySelectorAll('.branched-menu__reach'));
      reaches.forEach(function(r){r.style.strokeDashoffset=r.style.strokeDasharray;});
      const idx=Array.prototype.slice.call(sec.querySelectorAll('.branched-menu__item')).indexOf(lbl);
      if(reaches[idx]) reaches[idx].style.strokeDashoffset='0';
      if(lbl.dataset.href) location.href=lbl.dataset.href;   // 车辆总览 → 主页
      // 「车辆详情」为当前页；数据模块为待加占位，点击不跳转
    });
  });
}
/* buildNav / sideFoot / verTabs 在 init() 内（LIST 异步加载后）渲染 */

/* 无刷新切换车辆 */
function go(idx){
  if(idx<0||idx>=LIST.length) return;
  try{ history.pushState({id:LIST[idx].id},'','?id='+LIST[idx].id); }catch(e){}
  window.scrollTo(0,0); load(idx);
}

/* ---------- 列表（未指定车辆时） ---------- */
function renderPicker(){
  let html='<div class="card"><div class="sec-title">共 '+LIST.length+' 辆 · 选择一辆查看</div>'+
    '<div class="picker">'+LIST.map(function(x){
      const u=thumbUrl({图标b:x.thumb});
      return '<a class="pcard" href="?id='+x.id+'">'+
        '<div class="pimg">'+pic(u?[u]:[],(x.name||'?')[0])+'</div>'+
        '<div class="pbody"><div class="pn">'+esc(x.name)+'</div>'+
        '<div class="pm"><span>'+esc(x.maker||'')+'</span><span>#'+x.id+'</span></div></div></a>';
    }).join('')+'</div></div>';
  app.innerHTML=html;
}

/* ---------- 载入 ---------- */
let curIdx=-1;
/* 骨架屏：与最终详情布局一致（图片/皮肤在顶，文字在下），加载时无文字、无跳动 */
function skelPage(){
  const mini='<div class="skel" style="aspect-ratio:1;border-radius:10px"></div>';
  return '<div class="detail">'+
    '<div class="card">'+
      '<div class="skel" style="aspect-ratio:16/10;width:100%;border-radius:10px"></div>'+
      '<div class="skel" style="height:12px;width:130px;margin-top:10px"></div>'+
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:14px">'+
        mini+mini+mini+mini+'</div></div>'+
    '<div class="card">'+
      '<div class="skel" style="height:26px;width:200px"></div>'+
      '<div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap">'+
        '<div class="skel" style="height:22px;width:64px;border-radius:999px"></div>'+
        '<div class="skel" style="height:22px;width:52px;border-radius:999px"></div>'+
        '<div class="skel" style="height:22px;width:76px;border-radius:999px"></div></div>'+
      '<div class="skel" style="height:13px;width:100%;margin-top:14px"></div>'+
      '<div class="skel" style="height:13px;width:82%;margin-top:8px"></div>'+
      '<div class="skel" style="height:180px;margin-top:18px;border-radius:10px"></div></div>'+
    '</div>';
}
async function load(idx){
  if(idx<0||idx>=LIST.length){ renderPicker(); return; }
  curIdx=idx;
  const meta=LIST[idx];
  document.title=(meta.name||'车辆')+' · 车辆详情';
  const q=document.getElementById('q'); if(document.activeElement!==q) q.value='';
  app.innerHTML=skelPage();
  /* 整车档案直接取自已原生加载的合并文件（meta.file 现为车辆 ID 字符串） */
  const c=CAR_FULL[String(meta.file)];
  if(!c){
    app.innerHTML='<div class="msg">未找到该车辆（版本 '+esc(CUR_VER)+'）：<code>'+esc(meta.name||meta.file||'')+'</code><br><br>'+
      '请确认 <code>ace/'+esc(CUR_VER)+'/vehicles.json</code> 可访问。</div>';
    return;
  }
  app.innerHTML='<div class="detail">'+renderMedia(c)+renderInfo(c)+'</div>';
  bindMedia();

  try{ if(location.search.indexOf('id=')<0) history.replaceState(null,'','?id='+meta.id); }catch(e){}
}

function bindMedia(){
  const hero=document.getElementById('heroPic'); if(!hero) return;
  document.querySelectorAll('.mini').forEach(function(m){
    m.addEventListener('click',function(){
      document.querySelectorAll('.mini').forEach(x=>x.classList.remove('on'));
      m.classList.add('on');
      const src=m.getAttribute('data-src');
      hero.innerHTML=src?('<img src="'+esc(src)+'" onerror="this.remove()">'):
        '<span class="ph">'+esc(m.getAttribute('data-name')||'?')[0]+'</span>';
      document.getElementById('heroName').textContent=m.getAttribute('data-name')||'原皮';
    });
  });
}

/* ---------- 版本标签（独立打开时可用；iframe 模式由外壳提供） ---------- */
function renderVerTabs(){
  const el=document.getElementById('verTabs'); if(!el) return;
  /* 版本始终按「最新在前」展示（版本号 = 分钟时间戳，越大越新） */
  const vers=VERSIONS.slice().sort(function(a,b){ return Number(b.id)-Number(a.id); });
  el.innerHTML='<div class="vt-hd">数据版本</div>'+vers.map(function(x){
    return '<span class="vt'+(x.id===CUR_VER?' on':'')+'" data-v="'+esc(x.id)+'">'+esc(x.label)+'</span>';
  }).join('');
  el.querySelectorAll('.vt').forEach(function(t){
    t.addEventListener('click',function(){ setVer(t.getAttribute('data-v')); });
  });
}
function setVer(v){
  if(!VERSIONS.some(x=>x.id===v) || v===CUR_VER) return;
  CUR_VER=v;
  try{ localStorage.setItem('va_ver',v); }catch(e){}
  /* 新版本数据是懒加载的 → 切过来时按需补预取 */
  if(window.AceDataCache&&AceDataCache.ensureVersion) AceDataCache.ensureVersion(v);
  if(window.parent!==window){
    try{ window.parent.postMessage({type:'verChanged',v:v},'*'); }catch(e){}
  }
  init();
}
/* 外壳通知子页切换版本 / 无刷新切换车辆 */
addEventListener('message',function(e){
  if(!e.data) return;
  if(e.data.type==='setVersion') setVer(e.data.v);
  else if(e.data.type==='showCar'){
    const i=byId[String(e.data.id)];
    if(i===undefined) return;
    if(i!==curIdx) go(i);   // 数据已在内存，秒切
  }
});

/* ---------- 入口 ---------- */
function startIdx(){
  const p=new URLSearchParams(location.search);
  const id=p.get('id'), f=p.get('f'), n=p.get('name');
  if(id!==null&&byId[id]!==undefined) return byId[id];
  if(f){ const i=LIST.findIndex(x=>x.file===f); if(i>=0) return i; }
  if(n&&byName[n]!==undefined) return byName[n];
  return -1;
}
// 被外壳载入时，「车辆库」返回交给外壳切回列表页
document.querySelector('.brand').addEventListener('click',function(e){
  if(window.parent!==window&&window.parent.openList){ e.preventDefault(); window.parent.openList(); }
});
const qi=document.getElementById('q');
qi.addEventListener('keydown',function(e){
  if(e.key!=='Enter') return;
  const v=qi.value.trim();
  if(!v) return;
  if(byName[v]!==undefined) go(byName[v]);
  else if(byId[v]!==undefined) go(byId[v]);
  else{
    const hit=LIST.filter(x=>x.name.indexOf(v)>=0||String(x.id).indexOf(v)>=0);
    if(hit.length) go(byId[hit[0].id]);
    else qi.value='未找到：'+v;
  }
});
addEventListener('popstate',function(){ load(startIdx()); });

async function init(){
  try{ localStorage.setItem('va_ver',CUR_VER); }catch(e){}
  await loadIndex(CUR_VER);
  buildNav();
  document.getElementById('sideFoot').textContent='数据 '+CUR_VER+' · '+LIST.length+' 辆';
  renderVerTabs();
  document.getElementById('carlist').innerHTML=LIST.map(x=>'<option value="'+esc(x.name)+'">#'+x.id+'</option>').join('');
  if(!LIST.length){
    app.innerHTML='<div class="msg">未能加载索引（版本 '+esc(CUR_VER)+'）。请确认 <code>ace/'+esc(CUR_VER)+'/vehicles.json</code> 可访问。</div>';
    return;
  }
  load(startIdx());
}
init().catch(function(err){
  app.innerHTML='<div class="msg">数据载入失败：'+esc(err&&err.message?String(err.message):'')+
    '<br><br>请确认通过 HTTP 访问，且 <code>ace/'+esc(CUR_VER)+'/vehicles.json</code> 可访问。</div>';
});
</script>
</body>
