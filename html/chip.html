<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>芯片 · 车辆档案库</title>
<style>
:root{
  --bg:#f3f4f7;
  --surface:#fff;
  --surface-2:rgba(244,245,248,.62);
  --ink:#23272f;
  --ink-2:#5b626e;
  --muted:#9aa1ad;
  --line:rgba(35,39,47,0.08);
  --line-2:rgba(35,39,47,0.13);
  --accent:#6d5efc;
  --accent-ink:#5a45f5;
  --accent-soft:rgba(109,94,252,0.10);
  --radius:16px;
  --radius-sm:10px;
  --sh-1:0 1px 2px rgba(35,39,47,.04), 0 1px 3px rgba(35,39,47,.05);
  --sh-2:0 10px 28px rgba(35,39,47,.10), 0 2px 6px rgba(35,39,47,.05);
  --sh-3:0 18px 44px rgba(35,39,47,.14);
  --font:'PingFang SC','Microsoft YaHei',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);color:var(--ink);background:var(--bg);
  overflow:auto;-webkit-font-smoothing:antialiased;
}
::selection{background:rgba(109,94,252,.16);color:var(--accent-ink)}
.main{padding:22px 26px 56px}

/* ---------- 顶栏 ---------- */
.toolbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:8px;flex-wrap:nowrap;
  padding:15px 26px 13px;margin:0 -26px 16px;
  background:rgba(243,244,247,.86);
  backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--line);
}
.toolbar h2{font-size:18px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:7px;flex:0 0 auto;white-space:nowrap}
.toolbar .count{font-size:11px;font-weight:500;color:var(--muted);background:#eceef3;padding:2px 7px;border-radius:999px;white-space:nowrap}
.selects{display:flex;gap:7px;flex-wrap:wrap;align-items:center;flex:0 1 auto;min-width:0}
.selects::-webkit-scrollbar{height:0}

/* 下拉 */
.sel{position:relative;min-width:96px;flex:0 0 auto}
.sel-btn{
  display:flex;align-items:center;gap:7px;width:100%;justify-content:flex-start;
  padding:7px 11px;border-radius:var(--radius-sm);font-size:12.5px;cursor:pointer;user-select:none;
  background:#fff;border:1px solid var(--line-2);color:var(--ink-2);
  box-shadow:var(--sh-1);transition:.15s;font-family:inherit;white-space:nowrap;
}
.sel-btn>span{white-space:nowrap}
.sel-btn:hover{border-color:var(--accent);color:var(--ink)}
.sel-btn .ic{
  width:18px;height:18px;flex:0 0 18px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:6px;background:rgba(35,39,47,.06);color:var(--ink-2);
  font-size:10px;font-weight:700;line-height:1;transition:.15s;
}
.sel-btn:hover .ic{background:var(--accent-soft);color:var(--accent-ink)}
.sel-btn .arrow{font-size:8px;color:var(--muted);margin-left:auto;transition:transform .2s ease;line-height:1}
.sel.open .sel-btn{border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 3px var(--accent-soft)}
.sel.open .sel-btn .ic{background:var(--accent-soft);color:var(--accent-ink)}
.sel.open .sel-btn .arrow{transform:rotate(180deg);color:var(--accent-ink)}
.sel-list{
  position:absolute;top:calc(100% + 6px);left:0;min-width:100%;max-height:340px;overflow:auto;z-index:40;
  display:none;flex-direction:column;gap:2px;padding:6px;border-radius:var(--radius-sm);
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid var(--line);box-shadow:var(--sh-3);
}
.sel.open .sel-list{display:flex;animation:dropIn .16s ease}
@keyframes dropIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.sel-list .opt{padding:7px 10px;border-radius:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.sel-list .opt:hover{background:var(--accent-soft);color:var(--accent-ink)}
.sel-list .opt.on{color:var(--accent-ink);font-weight:600}
.sel-list .opt.on::after{content:"✓";margin-left:auto;font-size:11px}
.sel-list .opt .hint{margin-left:auto;font-size:10.5px;color:var(--muted);font-weight:400}
.sel-list .opt.on .hint{display:none}
/* 版本下拉：保留日期 */
.sel[data-dd="__ver"] .opt.on .hint{display:inline}
.sel-btn .vtime{font-style:normal;font-size:10.5px;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}

.search{margin-left:auto;position:relative;display:flex;align-items:center;flex:1 1 130px;min-width:104px;max-width:260px}
.search input{
  width:100%;min-width:0;padding:8px 12px 8px 34px;border-radius:var(--radius-sm);
  background:#fff;border:1px solid var(--line-2);color:var(--ink);
  font-size:12.5px;outline:none;transition:.15s;box-shadow:var(--sh-1);font-family:inherit;
}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted);opacity:.6;pointer-events:none}

/* 被外壳 iframe 嵌入时：版本下拉由外壳侧栏提供，页内不再重复 */
html.embedded .sel[data-dd="__ver"]{display:none}

/* 竖屏 / 窄屏：标题+搜索一行，筛选整行另起 */
@media (max-width:700px){
  .toolbar,.trow{flex-wrap:wrap;row-gap:8px}
  .toolbar h2{flex:0 1 auto;min-width:0;overflow:hidden;font-size:17px}
  .search{flex:1 1 120px;min-width:96px;max-width:none;margin-left:auto}
  .selects{flex:1 1 100%;order:3;gap:6px;row-gap:6px}
  .sel{flex:0 1 auto}
}
@media (max-width:420px){
  .search{flex:1 1 100%}
}

/* ---------- 芯片卡 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:16px}
.chip{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 14px 13px;cursor:pointer;box-shadow:var(--sh-1);--q:#9aa6bd;
  transition:transform .22s cubic-bezier(.23,1,.32,1), box-shadow .22s, border-color .22s;
}
.chip:hover{transform:translateY(-5px);box-shadow:var(--sh-3);border-color:color-mix(in srgb,var(--q) 45%,transparent)}
.chip:active{transform:translateY(-2px) scale(.992)}
.chip-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.glyph{
  width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  color:var(--q);
  background:linear-gradient(158deg,color-mix(in srgb,var(--q) 20%,#fff),color-mix(in srgb,var(--q) 7%,#fff));
  border:1px solid color-mix(in srgb,var(--q) 32%,transparent);
  box-shadow:0 8px 16px -10px color-mix(in srgb,var(--q) 75%,transparent);
}
.glyph svg{width:26px;height:26px}
.qbadge{font-size:11px;font-weight:700;color:var(--q);background:color-mix(in srgb,var(--q) 12%,#fff);
  border:1px solid color-mix(in srgb,var(--q) 30%,transparent);padding:3px 9px;border-radius:999px;letter-spacing:.02em}
.chip-nm{font-size:14.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-nm .nm-sym{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px}
.chip-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11px;padding:3px 9px;border-radius:999px;background:#f4f5f8;color:var(--ink-2);border:1px solid var(--line)}
.tag.sh{background:color-mix(in srgb,var(--q) 11%,#fff);color:var(--q);border-color:color-mix(in srgb,var(--q) 26%,transparent)}
.chip-eff{margin-top:10px;font-size:12px;color:var(--ink-2);line-height:1.5;
  background:#f7f8fa;border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.chip-eff b{color:var(--q);font-weight:700}
.chip-eff .arr{color:var(--muted);margin:0 3px}

.loading,.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:56px 20px;color:var(--ink-2);text-align:center;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh-1)}
.empty .big{font-size:16px;font-weight:600;color:var(--ink-2)}

/* ---------- 详情弹层 ---------- */
.mask{position:fixed;inset:0;z-index:90;background:rgba(23,26,32,.42);backdrop-filter:blur(3px);
  display:none;align-items:flex-start;justify-content:center;padding:44px 18px;overflow:auto}
.mask.open{display:flex}
.modal{--q:#9aa6bd;width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--sh-3);padding:23px 22px 22px;position:relative;overflow:hidden;animation:pop .18s ease}
.modal::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;
  background:linear-gradient(90deg,var(--q),color-mix(in srgb,var(--q) 22%,#fff))}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.mclose{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);
  background:#fff;color:var(--ink-2);font-size:15px;cursor:pointer;line-height:1}
.mclose:hover{color:var(--accent-ink);border-color:var(--accent)}
.mhd{display:flex;align-items:center;gap:14px;padding-right:34px;padding-bottom:15px;border-bottom:1px solid var(--line)}
.mhd .glyph{width:56px;height:56px;border-radius:16px}
.mhd .glyph svg{width:30px;height:30px}
.mhd h3{font-size:20px;font-weight:700;letter-spacing:.2px}
.mhd .sub{font-size:12px;color:var(--muted);margin-top:4px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:16px 0 4px}
.mkv{background:#f7f8fa;border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px}
.mkv .k{font-size:11px;color:var(--muted)}
.mkv .v{font-size:13.5px;font-weight:600;margin-top:3px}
.meff{margin-top:16px}
.meff h4{font-size:13px;color:var(--ink-2);margin-bottom:9px;font-weight:600}
.efftext{font-size:13px;line-height:1.75;color:var(--ink);background:#f7f8fa;border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:10px 12px;word-break:break-word}
.ph0{display:inline-block;padding:0 5px;margin:0 1px;border-radius:5px;
  background:color-mix(in srgb,var(--q) 14%,#fff);color:var(--q);font-weight:700}
.lvrow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lvpill{background:linear-gradient(180deg,#fbfbfd,#f3f4f8);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:8px 6px;text-align:center;transition:.15s}
.lvpill:hover{border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:#fff}
.lvpill i{display:block;font-style:normal;font-size:10.5px;color:var(--muted)}
.lvpill b{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-top:2px}
@media(max-width:520px){.main{padding:16px 14px 48px}.toolbar{padding:14px 14px 12px;margin:0 -14px 14px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
</style>
</head>
<body>
<main class="main" id="main"><div class="loading">正在载入芯片数据…</div></main>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<script src="assets/preload.js?v=20290929"></script>
<script>
(function(){
'use strict';
if(window.parent!==window) document.documentElement.classList.add('embedded');

/* ---------- 版本 ---------- */
const VERSIONS=[{id:'29836883',label:'29836883',chips:'../ace/29836883/chips.json'},{id:'29842023',label:'29842023',chips:'../ace/29842023/chips.json'}];
const DEFAULT_VER='29842023';
/* 版本号 → 时间：版本号是「Unix 时间戳的分钟数」 */
function verTime(id){
  const n=Number(id);
  if(!isFinite(n)||n<=0) return '';
  const d=new Date(n*60000), p=v=>String(v).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function getVerParam(){
  const p=new URLSearchParams(location.search);
  let v=p.get('v');
  if(!v){ try{ v=localStorage.getItem('va_ver'); }catch(e){} }
  return VERSIONS.some(x=>x.id===v)?v:DEFAULT_VER;
}
let CUR_VER=getVerParam();
function verCfg(v){ return VERSIONS.find(x=>x.id===v)||VERSIONS[0]; }
const resolveChipsUrl=v=>verCfg(v).chips||'chips.json';

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const QUAL={1:['普通','#6b7280'],2:['稀有','#2563eb'],3:['史诗','#9333ea'],4:['传说','#d97706']};
const qual=id=>QUAL[+id]||['未知','#9aa6bd'];
const fmtNum=v=>{ const n=Number(v); return isFinite(n)?(Math.round(n*1000)/1000).toString():String(v==null?'':v); };
const shapeShort=s=>String(s||'').replace('芯片','')||'—';
const tplHtml=tpl=>esc(tpl).replace(/\{0\}|\{\}/g,'<span class="ph0">{0}</span>');
/* 卡片：把 {0} 换成「L1 → L10」范围，避免整句模板重复两遍 */
const effRange=(tpl,lo,hi)=>{
  const v=(lo==null||hi==null||lo===hi)?('<b>'+esc(fmtNum(lo==null?hi:lo))+'</b>')
    :('<b>'+esc(fmtNum(lo))+'</b><span class="arr">→</span><b>'+esc(fmtNum(hi))+'</b>');
  return String(tpl||'').replace(/\{0\}|\{\}/g,v);
};
/* 名称里的形状后缀（如「增幅装置·◇」）单独淡显 */
const nameHtml=name=>{
  const m=String(name||'').match(/^(.*?)([·・]\S{1,2})$/);
  return m?(esc(m[1])+'<span class="nm-sym">'+esc(m[2])+'</span>'):esc(name);
};

const GLYPH={
  '圆形':'<circle cx="12" cy="12" r="7"/>',
  '三角形':'<path d="M12 5l7.5 13h-15z"/>',
  '菱形':'<path d="M12 3l7.5 9-7.5 9-7.5-9z"/>',
  '六边形':'<path d="M12 3l7.5 4.5v9L12 21l-7.5-4.5v-9z"/>',
  'V形':'<path d="M5 6l7 13 7-13"/>',
  '核心':'<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/>'
};
function shapeSvg(shape){
  const k=String(shape||'').replace('芯片','');
  const inner=GLYPH[k]||'<rect x="5" y="5" width="14" height="14" rx="3"/>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>';
}

/* ---------- 状态 ---------- */
let CHIPS=[];
let keyword='';
let sortKey='qid';
const filters={'形状':[],'品质':[],'类型':[]};
let openDD=null;
const SORTS=[{k:'qid',n:'品质 高→低'},{k:'name',n:'名称'},{k:'id',n:'ID 小→大'}];
const GROUPS=[
  {key:'形状',get:c=>c.shape},
  {key:'品质',get:c=>c.quality},
  {key:'类型',get:c=>c.type}
];
const mainEl=document.getElementById('main');
const maskEl=document.getElementById('mask');
const modalEl=document.getElementById('modal');

/* ---------- 载入 ---------- */
async function load(v){
  const _fetch=(window.AceDataCache&&AceDataCache.fetchData)||fetch;
  const r=await _fetch(resolveChipsUrl(v));
  if(!r.ok) throw new Error('HTTP '+r.status+' · '+resolveChipsUrl(v));
  const data=await r.json();
  CHIPS=[];
  Object.keys(data).forEach(function(k){
    const rec=data[k]&&data[k]['芯片档案']?data[k]['芯片档案']:data[k];
    if(!rec||typeof rec!=='object') return;
    const b=rec['基础']||{};
    const eff=(rec['效果']||[])[0]||null;
    const lv=(eff&&eff['等级数值'])||[];
    CHIPS.push({
      id:b['数据ID'],
      name:b['名称']||('ID '+b['数据ID']),
      shape:b['形状']||'', quality:b['品质']||'', qid:+b['品质ID']||0,
      type:b['类型']||'', cat:b['分类']||'', attr:b['属性']||'',
      icon:(rec['图标']&&(rec['图标']['大图']||rec['图标']['小图']))||'',
      tpl:(eff&&eff['模板'])||'', levels:lv,
      lo:lv.length?lv[0].数值:null, hi:lv.length?lv[lv.length-1].数值:null
    });
  });
  CHIPS.forEach(c=>{ c._s=(c.name+' '+c.cat+' '+c.attr+' '+c.shape+' '+c.type).toLowerCase(); });
}

/* ---------- 渲染 ---------- */
function summary(arr){ return !arr||!arr.length?'全部':(arr.length===1?arr[0]:arr.length+' 项'); }
function ddHtml(key,label,items,sel){
  const open=openDD===key;
  const sum=summary(sel);
  const text=sum==='全部'?label:label+'：'+sum;
  return '<div class="sel'+(open?' open':'')+'" data-dd="'+esc(key)+'">'+
    '<button class="sel-btn" type="button"><span class="ic">'+esc(label.slice(0,1))+'</span>'+
      '<span>'+esc(text)+'</span><span class="arrow">▼</span></button>'+
    '<div class="sel-list">'+items.map(function(it){
      return '<div class="opt'+(sel.indexOf(it.v)>=0?' on':'')+'" data-k="'+esc(key)+'" data-v="'+esc(it.v)+'">'+
        '<span>'+esc(it.n)+'</span><span class="hint">'+it.c+'</span></div>';
    }).join('')+'</div></div>';
}
function verHtml(){
  const open=openDD==='__ver';
  const t=verTime(CUR_VER);
  const opts=VERSIONS.map(function(x){
    const xt=verTime(x.id);
    return '<div class="opt'+(x.id===CUR_VER?' on':'')+'" data-ver="'+esc(x.id)+'" title="'+esc(xt)+'"><span>'+esc(x.label)+'</span>'+
      (xt?'<span class="hint">'+esc(xt.slice(0,10))+'</span>':'')+'</div>';
  }).join('');
  return '<div class="sel'+(open?' open':'')+'" data-dd="__ver">'+
    '<button class="sel-btn" type="button"><span class="ic">版</span>'+
      '<span>版本：'+esc(CUR_VER)+(t?'<i class="vtime">'+esc(t.slice(0,10))+'</i>':'')+'</span><span class="arrow">▼</span></button>'+
    '<div class="sel-list">'+opts+'</div></div>';
}
function counts(items,get){
  const m={};
  CHIPS.forEach(c=>{ const v=get(c); if(v==null||v==='')return; m[v]=(m[v]||0)+1; });
  return Object.keys(m).sort(function(a,b){ return m[b]-m[a]; }).map(k=>({v:k,c:m[k],n:k}));
}
function filtered(){
  const q=keyword.trim().toLowerCase();
  const list=CHIPS.filter(function(c){
    if(q && c._s.indexOf(q)<0) return false;
    for(let i=0;i<GROUPS.length;i++){
      const g=GROUPS[i], sel=filters[g.key];
      if(sel&&sel.length&&sel.indexOf(String(g.get(c)))<0) return false;
    }
    return true;
  });
  if(sortKey==='qid') list.sort((a,b)=>b.qid-a.qid||a.id-b.id);
  else if(sortKey==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hans-CN'));
  else list.sort((a,b)=>(a.id||0)-(b.id||0));
  if(sortKey==='qid'){ /* 品质相同时按形状/分类再排，观感更整齐 */ }
  return list;
}
function cardHtml(c){
  const q=qual(c.qid);
  return '<div class="chip" data-id="'+esc(c.id)+'" style="--q:'+q[1]+'">'+
    '<div class="chip-hd"><span class="glyph">'+shapeSvg(c.shape)+'</span>'+
      '<span class="qbadge">'+esc(c.quality||'—')+'</span></div>'+
    '<div class="chip-nm">'+nameHtml(c.name)+'</div>'+
    '<div class="chip-meta"><span class="tag sh">'+esc(shapeShort(c.shape))+'</span>'+
      (c.cat?'<span class="tag">'+esc(c.cat)+'</span>':'')+'</div>'+
    (c.tpl?'<div class="chip-eff">'+effRange(c.tpl,c.lo,c.hi)+'</div>':'')+
    '</div>';
}
function render(){
  const list=filtered();
  const h='<div class="toolbar"><h2>芯片<span class="count">'+list.length+' / '+CHIPS.length+' 个</span></h2>'+
    '<div class="selects">'+
      ddHtml('形状','形状',counts(CHIPS,c=>c.shape),filters['形状'])+
      ddHtml('品质','品质',counts(CHIPS,c=>c.quality),filters['品质'])+
      ddHtml('类型','类型',counts(CHIPS,c=>c.type),filters['类型'])+
      '<div class="sel" data-kind="sort"><button class="sel-btn" type="button" data-sort="1">'+
        '<span class="ic">排</span><span>'+esc((SORTS.find(s=>s.k===sortKey)||SORTS[0]).n)+'</span>'+
        '<span class="arrow">▼</span></button></div>'+
      verHtml()+
    '</div>'+
    '<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'+
      '<input id="q" placeholder="搜索芯片名 / 分类…" value="'+esc(keyword)+'" autocomplete="off"></div>'+
    '</div>'+
    (list.length?'<div class="grid">'+list.map(cardHtml).join('')+'</div>'
      :'<div class="empty"><div class="big">没有匹配的芯片</div><div>试着放宽筛选条件，或清空搜索关键词。</div></div>');
  mainEl.innerHTML=h;
  bind();
}
/* 轻量：只重绘网格 */
function renderGrid(){
  const g=mainEl.querySelector('.grid');
  const list=filtered();
  const cnt=mainEl.querySelector('.toolbar .count');
  if(cnt) cnt.textContent=list.length+' / '+CHIPS.length+' 个';
  if(!g){
    if(list.length){ const t=mainEl.querySelector('.toolbar'); const d=document.createElement('div'); d.className='grid'; d.innerHTML=list.map(cardHtml).join(''); t.insertAdjacentElement('afterend',d); }
    return;
  }
  g.innerHTML=list.map(cardHtml).join('');
  const emp=mainEl.querySelector('.empty');
  if(emp) emp.remove();
}

/* ---------- 详情弹层 ---------- */
function openDetail(c){
  const q=qual(c.qid);
  modalEl.style.setProperty('--q',q[1]);
  const kv=arr=>arr.filter(x=>x[1]).map(x=>'<div class="mkv"><div class="k">'+esc(x[0])+'</div><div class="v">'+esc(x[1])+'</div></div>').join('');
  const lv=(c.levels||[]).map(l=>'<div class="lvpill"><i>L'+esc(l['等级'])+'</i><b>'+esc(fmtNum(l['数值']))+'</b></div>').join('');
  modalEl.innerHTML='<button class="mclose" type="button" aria-label="关闭">✕</button>'+
    '<div class="mhd" style="--q:'+q[1]+'"><span class="glyph">'+shapeSvg(c.shape)+'</span>'+
      '<div><h3>'+esc(c.name)+'</h3><div class="sub">#'+esc(c.id)+' · '+esc(c.type||'—')+' · '+esc(shapeShort(c.shape))+'</div></div></div>'+
    '<div class="mgrid">'+kv([['品质',c.quality],['形状',shapeShort(c.shape)],['分类',c.cat],['属性',c.attr],['类型',c.type],['数据 ID',c.id]])+'</div>'+
    (c.tpl?'<div class="meff"><h4>效果模板</h4><div class="efftext">'+tplHtml(c.tpl)+'</div>'+
      '<h4 style="margin-top:14px">1 → 10 级数值</h4><div class="lvrow">'+lv+'</div></div>':'')+
    '<div style="margin-top:16px;font-size:11.5px;color:var(--muted)">模板中高亮的 <b>{0}</b> 即下表对应等级的数值。</div>';
  maskEl.classList.add('open');
  modalEl.querySelector('.mclose').onclick=closeDetail;
}
function closeDetail(){ maskEl.classList.remove('open'); modalEl.innerHTML=''; }
maskEl.addEventListener('click',function(e){ if(e.target===maskEl) closeDetail(); });
addEventListener('keydown',function(e){ if(e.key==='Escape'){ closeDetail(); openDD=null; } });

/* ---------- 事件 ---------- */
function bind(){
  const tb=mainEl.querySelector('.toolbar');
  tb.addEventListener('click',function(e){
    const sb=e.target.closest('.sel-btn');
    if(sb){
      const drop=sb.parentNode;
      const key=drop.dataset.dd;
      if(drop.dataset.kind==='sort'){   // 排序：点一下往后轮换
        const i=SORTS.findIndex(s=>s.k===sortKey);
        sortKey=SORTS[(i+1)%SORTS.length].k;
        render(); return;
      }
      const open=!drop.classList.contains('open');
      Array.prototype.forEach.call(tb.querySelectorAll('.sel'),d=>d.classList.remove('open'));
      openDD=open?key:null;
      if(open) drop.classList.add('open');
      return;
    }
    const ver=e.target.closest('[data-ver]');
    if(ver){ changeVer(ver.dataset.ver); return; }
    const opt=e.target.closest('.opt');
    if(opt){
      const k=opt.dataset.k, v=opt.dataset.v;
      const arr=filters[k];
      const i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v);
      openDD=k; render(); return;
    }
  });
  const q=mainEl.querySelector('#q');
  q.addEventListener('input',function(){ keyword=this.value; renderGrid(); });
  const grid=mainEl.querySelector('.grid');
  if(grid) grid.addEventListener('click',function(e){
    const card=e.target.closest('.chip'); if(!card) return;
    const c=CHIPS.find(x=>String(x.id)===card.dataset.id);
    if(c) openDetail(c);
  });
}
document.addEventListener('click',function(e){
  if(!e.target.closest('.sel')){ openDD=null; mainEl.querySelectorAll('.sel').forEach(d=>d.classList.remove('open')); }
});
function changeVer(v){
  if(!VERSIONS.some(x=>x.id===v)||v===CUR_VER) return;
  CUR_VER=v;
  try{ localStorage.setItem('va_ver',v); }catch(e){}
  if(window.parent!==window){ try{ window.parent.postMessage({type:'verChanged',v:v},'*'); }catch(e){} }
  boot();
}

/* ---------- 启动 ---------- */
async function boot(){
  mainEl.innerHTML='<div class="loading">正在载入芯片数据…</div>';
  try{ await load(CUR_VER); render(); }
  catch(err){ mainEl.innerHTML='<div class="empty"><div class="big">芯片数据载入失败</div><div>'+esc(err.message)+'</div>'+
    '<div style="font-size:12px">请确认通过 HTTP 访问，且 <code>ace/'+esc(CUR_VER)+'/chips.json</code> 可访问。</div></div>'; }
}
boot();
})();
</script>
