<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跳转中…</title>
</head>
<body>
<script>
// GitHub Pages 会把未匹配的路径交给 404.html。
// 形如 /vehicle-archive/10032 → 转成 /vehicle-archive/?id=10032，由 index.html 打开对应车辆。
(function () {
  var seg = (location.pathname.replace(/\/+$/, '').split('/').pop() || '').trim();
  if (/^\d{2,}$/.test(seg)) {
    location.replace('./?id=' + seg);
  } else {
    location.replace('./');
  }
})();
</script>
</body>
</html>
